<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>작업 일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #faf6ef;
    --ink: #3a3027;
    --ink-deep: #2a2017;
    --muted: #9c8d77;
    --faint: #b0a085;
    --accent: #c2410c;
    --accent-soft: #fbe8d8;
    --line: #ece2d1;
    --line-strong: #e3d8c5;
    --card: #fff;
    --font-display: 'Gowun Batang', serif;
    --font-body: 'Gothic A1', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--paper);
    background-image: radial-gradient(#efe6d6 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-family: var(--font-display); font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -.02em; color: var(--ink-deep); }
  .subtitle { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 12px; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  button, .btn { font-family: var(--font-body); cursor: pointer; }
  .ghost-btn { background: var(--card); color: #7a6c57; border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 500; }
  .ghost-btn:active { transform: scale(.97); }
  .primary-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 9px 18px; font-size: 14px; font-weight: 700; }
  .primary-btn:active { transform: scale(.97); }

  .sync-badge { font-size: 12px; min-width: 60px; text-align: right; }
  .sync-idle { color: var(--faint); }
  .sync-ok { color: #15803d; }
  .sync-warn { color: var(--accent); }
  .sync-sync { color: var(--muted); }

  .month-bar { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 6px 0 18px; }
  .nav-btn { background: var(--card); border: 1px solid var(--line-strong); border-radius: 12px; width: 40px; height: 40px; font-size: 22px; line-height: 1; color: #7a6c57; box-shadow: 0 1px 2px #0000000a; }
  .month-label { text-align: center; min-width: 130px; }
  .month-year { display: block; font-size: 12px; color: var(--faint); letter-spacing: .15em; }
  .month-name { display: block; font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--ink-deep); }

  .stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; text-align: center; box-shadow: 0 1px 3px #0000000a; }
  .stat-num { font-family: var(--font-display); font-size: 23px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px #0000000d; }

  .week-header { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .week-header-cell { text-align: center; font-size: 12px; font-weight: 700; padding: 4px 0; }
  .week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .day-empty { aspect-ratio: 1/1; }
  .day { aspect-ratio: 1/1; border: 1px solid #f0e8da; border-radius: 10px; background: #fdfbf6; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 6px 2px 2px; position: relative; transition: background .15s, transform .1s; }
  .day:hover { background: #f3ebdf; transform: translateY(-1px); }
  .day.today { border: 2px solid var(--accent); background: #fff7ef; }
  .day-num { font-size: 14px; }
  .day-dots { display: flex; gap: 2px; margin-top: auto; margin-bottom: 4px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }

  .gant-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin-bottom: 12px; color: var(--ink-deep); }
  .empty { padding: 22px 8px; text-align: center; color: var(--faint); font-size: 13px; }
  .gant-scroll { overflow-x: auto; padding-bottom: 6px; }
  .gant-axis, .gant-row { display: flex; align-items: center; margin-bottom: 6px; }
  .gant-row-label { width: 92px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding-right: 8px; }
  .gant-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .gant-name { font-size: 12px; color: #5a4d3c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gant-track { display: flex; flex: 1; }
  .gant-tick { width: 22px; flex-shrink: 0; text-align: center; font-size: 9px; color: #c3b49b; }
  .gant-cell { width: 22px; flex-shrink: 0; height: 18px; display: flex; align-items: center; padding: 0 1px; }
  .gant-bar { height: 14px; width: 100%; box-shadow: 0 1px 2px #00000018; }

  .backup-row { display: flex; gap: 10px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }

  /* 모달 */
  .overlay { position: fixed; inset: 0; background: #2a201788; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; backdrop-filter: blur(2px); }
  .modal { background: var(--paper); border-radius: 18px; width: 100%; max-width: 480px; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px #00000040; border: 1px solid var(--line-strong); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
  .modal-date { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--ink-deep); }
  .modal-weekday { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .close-btn { background: none; border: none; font-size: 28px; line-height: 1; color: var(--faint); }
  .modal-body { padding: 16px 20px; overflow-y: auto; }
  .modal-foot { padding: 12px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line); }

  .entry-block { margin-bottom: 16px; }
  .entry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .entry-swatch { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .entry-name { font-size: 14px; font-weight: 700; color: var(--ink); }
  .work-tag { font-size: 10px; background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 20px; font-weight: 700; }
  textarea, input { font-family: var(--font-body); }
  .textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; font-size: 13px; resize: vertical; background: #fff; color: var(--ink); }
  .words-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .words-input { width: 120px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; font-size: 14px; background: #fff; color: var(--ink); }
  .words-label { font-size: 13px; color: #7a6c57; }
  textarea:focus, input:focus { outline: 2px solid #c2410c33; border-color: var(--accent); }

  .add-row { display: flex; gap: 8px; align-items: stretch; }
  .add-input { flex: 1; border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; font-size: 14px; background: #fff; color: var(--ink); }
  .toggle-btn { border: 1px solid var(--line-strong); background: #fff; border-radius: 10px; padding: 0 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .toggle-btn.on { background: var(--accent-soft); color: var(--accent); border-color: #f0c9a8; font-weight: 700; }
  .hint { font-size: 12px; color: var(--faint); margin: 8px 2px 14px; }
  .cat-list { display: flex; flex-direction: column; gap: 8px; }
  .cat-item { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
  .cat-name-input { flex: 1; border: none; background: transparent; font-size: 14px; color: var(--ink); padding: 2px 0; }
  .mini-tag { border: 1px solid var(--line-strong); background: #fff; border-radius: 16px; padding: 3px 10px; font-size: 11px; color: var(--muted); }
  .mini-tag.on { background: var(--accent-soft); color: var(--accent); border-color: #f0c9a8; font-weight: 700; }
  .del-btn { background: none; border: none; font-size: 22px; color: #cbb89d; line-height: 1; padding: 0 4px; }

  .field-label { font-size: 12px; color: var(--muted); margin: 12px 2px 4px; }
  .status-note { font-size: 12px; color: var(--muted); margin: 6px 2px 0; line-height: 1.5; }
  .status-note a { color: var(--accent); }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #d8cab4; border-radius: 8px; }

  @media (max-width: 480px) {
    h1 { font-size: 26px; }
    .stat-num { font-size: 20px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ===================== 상수 =====================
const PALETTE = ["#c2410c","#b45309","#15803d","#0e7490","#1d4ed8","#6d28d9","#be185d","#0f766e","#a16207","#4d7c0f"];
const DEFAULT_CATEGORIES = [
  { id: "c1", name: "작품 1", color: PALETTE[0], isWork: true },
  { id: "c2", name: "작품 2", color: PALETTE[2], isWork: true },
  { id: "c3", name: "작품 3", color: PALETTE[4], isWork: true },
  { id: "s1", name: "스토어관리", color: PALETTE[6], isWork: false },
  { id: "s2", name: "배송", color: PALETTE[8], isWork: false },
];
const LS_DATA = "worklog:data:v1";
const LS_TOKEN = "worklog:gh_token:v1";
const LS_GISTID = "worklog:gist_id:v1";
const GIST_FILENAME = "worklog-data.json";

// ===================== 날짜 유틸 =====================
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y,m,day] = s.split("-").map(Number); return new Date(y, m-1, day); };
const todayStr = () => ymd(new Date());
const WEEKDAYS = ["일","월","화","수","목","금","토"];
const MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
let _uid = 0;
const uid = (p="id") => `${p}_${Date.now().toString(36)}_${(_uid++).toString(36)}`;

// ===================== Gist API =====================
async function gistRead(token, gistId) {
  const res = await fetch(`https://api.github.com/gists/${gistId}`, {
    headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json" },
  });
  if (!res.ok) throw new Error(`Gist 읽기 실패 (${res.status})`);
  const data = await res.json();
  const file = data.files && data.files[GIST_FILENAME];
  if (!file) throw new Error("Gist에 데이터 파일이 없어요.");
  return JSON.parse(file.content);
}
async function gistWrite(token, gistId, payload) {
  const body = JSON.stringify({
    files: { [GIST_FILENAME]: { content: JSON.stringify(payload) } },
  });
  if (gistId) {
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      method: "PATCH",
      headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json" },
      body,
    });
    if (!res.ok) throw new Error(`Gist 저장 실패 (${res.status})`);
    return (await res.json()).id;
  } else {
    const res = await fetch("https://api.github.com/gists", {
      method: "POST",
      headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json" },
      body: JSON.stringify({
        description: "작업 일지 트래커 데이터",
        public: false,
        files: { [GIST_FILENAME]: { content: JSON.stringify(payload) } },
      }),
    });
    if (!res.ok) throw new Error(`Gist 생성 실패 (${res.status})`);
    return (await res.json()).id;
  }
}

// ===================== 메인 앱 =====================
function App() {
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [entries, setEntries] = useState({});
  const [cursor, setCursor] = useState(() => { const n = new Date(); return { year: n.getFullYear(), month: n.getMonth() }; });
  const [selectedDate, setSelectedDate] = useState(null);
  const [manageOpen, setManageOpen] = useState(false);
  const [syncOpen, setSyncOpen] = useState(false);

  const [token, setToken] = useState(() => localStorage.getItem(LS_TOKEN) || "");
  const [gistId, setGistId] = useState(() => localStorage.getItem(LS_GISTID) || "");
  const [syncState, setSyncState] = useState("idle"); // idle | syncing | ok | warn
  const [syncMsg, setSyncMsg] = useState("");
  const loadedRef = useRef(false);
  const writeTimer = useRef(null);

  // 초기 로드: 로컬 캐시 먼저, 그 다음 Gist로 덮어쓰기
  useEffect(() => {
    try {
      const raw = localStorage.getItem(LS_DATA);
      if (raw) {
        const data = JSON.parse(raw);
        if (data.categories?.length) setCategories(data.categories);
        if (data.entries) setEntries(data.entries);
      }
    } catch (e) {}
    loadedRef.current = true;

    if (token && gistId) {
      setSyncState("syncing"); setSyncMsg("불러오는 중…");
      gistRead(token, gistId)
        .then((data) => {
          if (data.categories?.length) setCategories(data.categories);
          if (data.entries) setEntries(data.entries);
          setSyncState("ok"); setSyncMsg("동기화됨 ✓");
          setTimeout(() => setSyncState("idle"), 1600);
        })
        .catch((err) => { setSyncState("warn"); setSyncMsg("동기화 실패"); console.warn(err); });
    }
  }, []); // eslint-disable-line

  // 저장: 로컬 항상 + (연결됐으면) Gist 디바운스
  useEffect(() => {
    if (!loadedRef.current) return;
    const payload = { categories, entries, updatedAt: Date.now() };
    try { localStorage.setItem(LS_DATA, JSON.stringify(payload)); } catch (e) {}

    if (token) {
      if (writeTimer.current) clearTimeout(writeTimer.current);
      setSyncState("syncing"); setSyncMsg("저장 중…");
      writeTimer.current = setTimeout(async () => {
        try {
          const newId = await gistWrite(token, gistId, payload);
          if (!gistId && newId) { setGistId(newId); localStorage.setItem(LS_GISTID, newId); }
          setSyncState("ok"); setSyncMsg("동기화됨 ✓");
          setTimeout(() => setSyncState("idle"), 1600);
        } catch (err) { setSyncState("warn"); setSyncMsg("저장 실패"); console.warn(err); }
      }, 1200);
    }
  }, [categories, entries, token, gistId]);

  // 월 그리드
  const monthInfo = useMemo(() => {
    const { year, month } = cursor;
    const first = new Date(year, month, 1);
    const startWeekday = first.getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const cells = [];
    for (let i=0; i<startWeekday; i++) cells.push(null);
    for (let d=1; d<=daysInMonth; d++) cells.push(new Date(year, month, d));
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i=0; i<cells.length; i+=7) weeks.push(cells.slice(i, i+7));
    return { weeks, daysInMonth, year, month };
  }, [cursor]);

  const activeCategories = useMemo(() => {
    const { year, month } = cursor;
    const present = new Set();
    for (const ds in entries) {
      const d = parseYmd(ds);
      if (d.getFullYear()===year && d.getMonth()===month) {
        const day = entries[ds];
        for (const cid in day) { const c = day[cid]; if (c && (c.note?.trim() || c.words || c.done)) present.add(cid); }
      }
    }
    return categories.filter((c) => present.has(c.id));
  }, [entries, categories, cursor]);

  const hasEntryOn = useCallback((cid, dateStr) => {
    const day = entries[dateStr]; if (!day || !day[cid]) return false;
    const c = day[cid]; return !!(c.note?.trim() || c.words || c.done);
  }, [entries]);

  const dayHasAny = useCallback((dateStr) => {
    const day = entries[dateStr]; if (!day) return [];
    return categories.filter((c) => day[c.id] && (day[c.id].note?.trim() || day[c.id].words || day[c.id].done)).map((c) => c.color);
  }, [entries, categories]);

  const addCategory = (name, isWork) => {
    const used = new Set(categories.map((c) => c.color));
    const color = PALETTE.find((p) => !used.has(p)) || PALETTE[categories.length % PALETTE.length];
    setCategories((prev) => [...prev, { id: uid("c"), name, color, isWork }]);
  };
  const updateCategory = (id, patch) => setCategories((prev) => prev.map((c) => c.id===id ? {...c,...patch} : c));
  const removeCategory = (id) => setCategories((prev) => prev.filter((c) => c.id!==id));

  const saveDayEntry = (dateStr, perCat) => {
    setEntries((prev) => {
      const next = {...prev}; const cleaned = {};
      for (const cid in perCat) {
        const c = perCat[cid];
        if (c && (c.note?.trim() || c.words || c.done)) cleaned[cid] = { note: c.note?.trim()||"", ...(c.words ? {words: c.words} : {}) };
      }
      if (Object.keys(cleaned).length===0) delete next[dateStr]; else next[dateStr] = cleaned;
      return next;
    });
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ categories, entries }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `worklog-backup-${todayStr()}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try { const data = JSON.parse(reader.result);
        if (data.categories?.length) setCategories(data.categories);
        if (data.entries) setEntries(data.entries);
      } catch (e) { alert("백업 파일을 읽을 수 없어요."); }
    };
    reader.readAsText(file);
  };

  const monthStats = useMemo(() => {
    const { year, month } = cursor;
    const activeDays = new Set(); let totalWords = 0;
    for (const ds in entries) {
      const d = parseYmd(ds);
      if (d.getFullYear()===year && d.getMonth()===month) {
        const day = entries[ds]; let counted = false;
        for (const cid in day) { const c = day[cid]; if (c && (c.note?.trim() || c.words || c.done)) counted = true; if (c?.words) totalWords += c.words; }
        if (counted) activeDays.add(ds);
      }
    }
    return { activeDays: activeDays.size, totalWords };
  }, [entries, cursor]);

  const prevMonth = () => setCursor((c) => { const m = c.month-1; return m<0 ? {year:c.year-1, month:11} : {year:c.year, month:m}; });
  const nextMonth = () => setCursor((c) => { const m = c.month+1; return m>11 ? {year:c.year+1, month:0} : {year:c.year, month:m}; });

  const connectGist = (newToken, newGistId) => {
    setToken(newToken); localStorage.setItem(LS_TOKEN, newToken);
    if (newGistId) { setGistId(newGistId); localStorage.setItem(LS_GISTID, newGistId); }
    setSyncState("syncing"); setSyncMsg("연결 중…");
    gistRead(newToken, newGistId || gistId)
      .then((data) => {
        if (data.categories?.length) setCategories(data.categories);
        if (data.entries) setEntries(data.entries);
        setSyncState("ok"); setSyncMsg("동기화됨 ✓"); setTimeout(() => setSyncState("idle"), 1600);
      })
      .catch(() => {
        // gistId가 없으면 첫 저장 때 새로 만들어짐
        setSyncState("idle"); setSyncMsg("");
      });
  };
  const disconnectGist = () => {
    setToken(""); setGistId("");
    localStorage.removeItem(LS_TOKEN); localStorage.removeItem(LS_GISTID);
    setSyncState("idle"); setSyncMsg("");
  };

  const syncClass = { idle: "sync-idle", syncing: "sync-sync", ok: "sync-ok", warn: "sync-warn" }[syncState];

  return (
    <div className="wrap">
      <header>
        <div>
          <h1>작업 일지</h1>
          <p className="subtitle">매일의 작업을 기록하고, 이어지는 흐름을 봅니다</p>
        </div>
        <div className="header-right">
          <span className={`sync-badge ${syncClass}`}>{syncMsg}</span>
          <button className="ghost-btn" onClick={() => setSyncOpen(true)}>{token ? "동기화 ✓" : "동기화 설정"}</button>
          <button className="ghost-btn" onClick={() => setManageOpen(true)}>항목 관리</button>
        </div>
      </header>

      <div className="month-bar">
        <button className="nav-btn" onClick={prevMonth} aria-label="이전 달">‹</button>
        <div className="month-label">
          <span className="month-year">{cursor.year}</span>
          <span className="month-name">{MONTHS[cursor.month]}</span>
        </div>
        <button className="nav-btn" onClick={nextMonth} aria-label="다음 달">›</button>
      </div>

      <div className="stats-row">
        <div className="stat"><div className="stat-num">{monthStats.activeDays}</div><div className="stat-label">작업한 날</div></div>
        <div className="stat"><div className="stat-num">{monthStats.totalWords.toLocaleString()}</div><div className="stat-label">이번 달 글자 수</div></div>
        <div className="stat"><div className="stat-num">{activeCategories.length}</div><div className="stat-label">진행 항목</div></div>
      </div>

      <section className="card">
        <div className="week-header">
          {WEEKDAYS.map((w, i) => (
            <div key={w} className="week-header-cell" style={{ color: i===0 ? "#b91c1c" : i===6 ? "#1d4ed8" : "#8a7d6b" }}>{w}</div>
          ))}
        </div>
        {monthInfo.weeks.map((week, wi) => (
          <div key={wi} className="week-row">
            {week.map((date, di) => {
              if (!date) return <div key={di} className="day-empty" />;
              const ds = ymd(date); const colors = dayHasAny(ds); const isToday = ds===todayStr();
              return (
                <button key={di} className={`day${isToday ? " today" : ""}`} onClick={() => setSelectedDate(ds)}>
                  <span className="day-num" style={{ color: di===0 ? "#b91c1c" : di===6 ? "#1d4ed8" : "#3a3027", fontWeight: isToday ? 800 : 500 }}>{date.getDate()}</span>
                  <div className="day-dots">{colors.slice(0,5).map((c, i) => <span key={i} className="dot" style={{ background: c }} />)}</div>
                </button>
              );
            })}
          </div>
        ))}
      </section>

      <section className="card">
        <div className="gant-title">이어지는 작업 흐름</div>
        {activeCategories.length===0 ? (
          <div className="empty">이번 달 기록이 아직 없어요. 날짜를 눌러 기록을 시작하세요.</div>
        ) : (
          <div className="gant-scroll">
            <div style={{ minWidth: 92 + monthInfo.daysInMonth*22 }}>
              <div className="gant-axis">
                <div className="gant-row-label" />
                <div className="gant-track">
                  {Array.from({length: monthInfo.daysInMonth}, (_, i) => i+1).map((d) => (
                    <div key={d} className="gant-tick">{d % 2===1 ? d : ""}</div>
                  ))}
                </div>
              </div>
              {activeCategories.map((cat) => (
                <div key={cat.id} className="gant-row">
                  <div className="gant-row-label" title={cat.name}>
                    <span className="gant-swatch" style={{ background: cat.color }} />
                    <span className="gant-name">{cat.name}</span>
                  </div>
                  <div className="gant-track">
                    {Array.from({length: monthInfo.daysInMonth}, (_, i) => i+1).map((d) => {
                      const ds = ymd(new Date(cursor.year, cursor.month, d));
                      const on = hasEntryOn(cat.id, ds);
                      const prevOn = d>1 && hasEntryOn(cat.id, ymd(new Date(cursor.year, cursor.month, d-1)));
                      const nextOn = d<monthInfo.daysInMonth && hasEntryOn(cat.id, ymd(new Date(cursor.year, cursor.month, d+1)));
                      return (
                        <div key={d} className="gant-cell">
                          {on && (
                            <div title={`${cat.name} · ${cursor.month+1}/${d}`} className="gant-bar" style={{
                              background: cat.color,
                              borderTopLeftRadius: prevOn ? 0 : 6, borderBottomLeftRadius: prevOn ? 0 : 6,
                              borderTopRightRadius: nextOn ? 0 : 6, borderBottomRightRadius: nextOn ? 0 : 6,
                              marginLeft: prevOn ? -2 : 0, marginRight: nextOn ? -2 : 0,
                            }} />
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </section>

      <div className="backup-row">
        <button className="ghost-btn" onClick={exportData}>백업 내보내기</button>
        <label className="ghost-btn">백업 가져오기
          <input type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => e.target.files[0] && importData(e.target.files[0])} />
        </label>
      </div>

      {selectedDate && (
        <DayEditor dateStr={selectedDate} categories={categories} entry={entries[selectedDate] || {}}
          onClose={() => setSelectedDate(null)}
          onSave={(perCat) => { saveDayEntry(selectedDate, perCat); setSelectedDate(null); }} />
      )}
      {manageOpen && (
        <CategoryManager categories={categories} onAdd={addCategory} onUpdate={updateCategory} onRemove={removeCategory} onClose={() => setManageOpen(false)} />
      )}
      {syncOpen && (
        <SyncManager token={token} gistId={gistId} onConnect={connectGist} onDisconnect={disconnectGist} onClose={() => setSyncOpen(false)} />
      )}
    </div>
  );
}

// ===================== 날짜 기록 편집기 =====================
function DayEditor({ dateStr, categories, entry, onClose, onSave }) {
  const d = parseYmd(dateStr);
  const [draft, setDraft] = useState(() => {
    const init = {};
    categories.forEach((c) => { const e = entry[c.id] || {}; init[c.id] = { note: e.note||"", words: e.words||"", done: e.done||false };
    return init;
  });
  const setField = (cid, field, val) => setDraft((prev) => ({...prev, [cid]: {...prev[cid], [field]: val}}));
  const handleSave = () => {
    const out = {};
    categories.forEach((c) => {
      const e = draft[c.id]; const words = e.words==="" ? 0 : parseInt(e.words,10)||0;
      out[c.id] = { note: e.note, ...(c.isWork && words ? {words} : {}), ...(!c.isWork && e.done ? {done: true} : {}) };
    });
    onSave(out);
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="modal-date">{d.getMonth()+1}월 {d.getDate()}일</div>
            <div className="modal-weekday">{WEEKDAYS[d.getDay()]}요일 · {d.getFullYear()}</div>
          </div>
          <button className="close-btn" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {categories.map((c) => (
            <div key={c.id} className="entry-block">
              <div className="entry-head">
                <span className="entry-swatch" style={{ background: c.color }} />
                <span className="entry-name">{c.name}</span>
                {c.isWork && <span className="work-tag">작품</span>}
              </div>
              <textarea className="textarea" placeholder="오늘 한 일…" rows={2}
                value={draft[c.id].note} onChange={(e) => setField(c.id, "note", e.target.value)} />
              {c.isWork && (
                <div className="words-row">
                  <input className="words-input" type="number" min="0" placeholder="0"
                    value={draft[c.id].words} onChange={(e) => setField(c.id, "words", e.target.value)} />
                  <span className="words-label">자 작성</span>
                </div>
              )}
              {!c.isWork && (
                <label className="words-row" style={{ cursor: "pointer", userSelect: "none" }}>
                  <input type="checkbox" checked={draft[c.id].done}
                    onChange={(e) => setField(c.id, "done", e.target.checked)}
                    style={{ width: 18, height: 18, accentColor: "var(--accent)" }} />
                  <span className="words-label">완료로 표시</span>
                </label>
              )}
            </div>
          ))}
        </div>
        <div className="modal-foot">
          <button className="ghost-btn" onClick={onClose}>취소</button>
          <button className="primary-btn" onClick={handleSave}>저장</button>
        </div>
      </div>
    </div>
  );
}

// ===================== 항목 관리 =====================
function CategoryManager({ categories, onAdd, onUpdate, onRemove, onClose }) {
  const [name, setName] = useState(""); const [isWork, setIsWork] = useState(true);
  const handleAdd = () => { if (!name.trim()) return; onAdd(name.trim(), isWork); setName(""); };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><div className="modal-date">항목 관리</div><button className="close-btn" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <div className="add-row">
            <input className="add-input" placeholder="새 항목 이름 (예: 작품 4)" value={name}
              onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key==="Enter" && handleAdd()} />
            <button className={`toggle-btn${isWork ? " on" : ""}`} onClick={() => setIsWork((v) => !v)}>{isWork ? "작품 ✓" : "일반"}</button>
            <button className="primary-btn" onClick={handleAdd}>추가</button>
          </div>
          <p className="hint">'작품'으로 지정하면 글자 수를 함께 기록할 수 있어요.</p>
          <div className="cat-list">
            {categories.map((c) => (
              <div key={c.id} className="cat-item">
                <span className="entry-swatch" style={{ background: c.color }} />
                <input className="cat-name-input" value={c.name} onChange={(e) => onUpdate(c.id, { name: e.target.value })} />
                <button className={`mini-tag${c.isWork ? " on" : ""}`} onClick={() => onUpdate(c.id, { isWork: !c.isWork })}>{c.isWork ? "작품" : "일반"}</button>
                <button className="del-btn" onClick={() => onRemove(c.id)} aria-label="삭제">×</button>
              </div>
            ))}
          </div>
        </div>
        <div className="modal-foot"><button className="primary-btn" onClick={onClose}>완료</button></div>
      </div>
    </div>
  );
}

// ===================== 동기화 설정 =====================
function SyncManager({ token, gistId, onConnect, onDisconnect, onClose }) {
  const [t, setT] = useState(token); const [g, setG] = useState(gistId);
  const handleConnect = () => { if (!t.trim()) { alert("토큰을 입력해 주세요."); return; } onConnect(t.trim(), g.trim()); };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><div className="modal-date">기기 간 동기화</div><button className="close-btn" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <p className="status-note">
            GitHub 토큰을 입력하면 기록이 본인의 비공개 Gist에 저장돼서, 폰·노트북 어디서든 같은 기록을 볼 수 있어요.
            토큰은 이 기기 브라우저에만 저장됩니다.
          </p>
          <div className="field-label">GitHub 토큰 (gist 권한)</div>
          <input className="add-input" style={{ width: "100%" }} type="password" placeholder="ghp_..." value={t} onChange={(e) => setT(e.target.value)} />
          <div className="field-label">Gist ID (선택 — 다른 기기에서 연결할 때)</div>
          <input className="add-input" style={{ width: "100%" }} placeholder="비워두면 새로 만들어요" value={g} onChange={(e) => setG(e.target.value)} />
          <p className="status-note">
            <b>처음 설정</b>: 토큰만 넣고 연결하면 새 Gist가 자동 생성돼요. 생성 후 이 화면의 Gist ID를 확인해 다른 기기에 입력하세요.<br/>
            <b>토큰 만들기</b>: GitHub → Settings → Developer settings → Personal access tokens → <i>Tokens (classic)</i>에서 <b>gist</b> 권한만 체크해 발급.
          </p>
          {gistId && <p className="status-note">현재 Gist ID: <b>{gistId}</b></p>}
        </div>
        <div className="modal-foot">
          {token && <button className="ghost-btn" onClick={() => { onDisconnect(); onClose(); }}>연결 해제</button>}
          <button className="primary-btn" onClick={handleConnect}>연결</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
