<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

// ===================== 상수 =====================
const PALETTE = ["#e94560","#f59e0b","#34d399","#38bdf8","#818cf8","#c084fc","#fb7185","#2dd4bf","#fbbf24","#a3e635"];
const DEFAULT_CATEGORIES = [
  { id: "c1", name: "작품 1", color: PALETTE[0], isWork: true },
  { id: "c2", name: "작품 2", color: PALETTE[2], isWork: true },
  { id: "c3", name: "작품 3", color: PALETTE[4], isWork: true },
  { id: "s1", name: "스토어관리", color: PALETTE[6], isWork: false },
  { id: "s2", name: "배송", color: PALETTE[8], isWork: false },
];
const DEFAULT_ORB_CATEGORIES = [
  { id: "oc1", name: "창작", color: "#34d399" },
  { id: "oc2", name: "운영", color: "#f59e0b" },
  { id: "oc3", name: "집안일", color: "#38bdf8" },
  { id: "oc4", name: "일상·이동", color: "#c084fc" },
];
const LS_DATA = "worklog:data:v1";
const LS_TOKEN = "worklog:gh_token:v1";
const LS_GISTID = "worklog:gist_id:v1";
const LS_LAST_TAB = "worklog:last_tab:v1";
const BUILD = "2026-06-02.1";
const GIST_FILENAME = "worklog-data.json";
const ORB_SIZES = { s: 7, m: 11, l: 16, xl: 22 };
const ORB_SIZE_LABELS = { s: "작은", m: "중간", l: "큰", xl: "아주 큰" };
const hasMatter = typeof Matter !== "undefined";

// ===================== 날짜 유틸 =====================
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = (s) => { const [y,m,day] = s.split("-").map(Number); return new Date(y, m-1, day); };
const todayStr = () => ymd(new Date());
const WEEKDAYS = ["일","월","화","수","목","금","토"];
const MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
let _uid = 0;
const uid = (p="id") => `${p}_${Date.now().toString(36)}_${(_uid++).toString(36)}`;

const lighten = (hex, amt) => {
  if (!hex || hex[0] !== "#") return hex;
  const r = Math.min(255, parseInt(hex.slice(1,3),16) + amt);
  const g = Math.min(255, parseInt(hex.slice(3,5),16) + amt);
  const b = Math.min(255, parseInt(hex.slice(5,7),16) + amt);
  return `rgb(${r},${g},${b})`;
};

// ===================== 병합 유틸 =====================
// 구슬: 날짜별로 합치고, 같은 ID는 중복 제거. 변경 없으면 같은 참조 반환 (무한루프 방지)
function mergeOrbs(local, remote) {
  if (!remote || !Object.keys(remote).length) return local || {};
  if (!local || !Object.keys(local).length) return remote;
  let changed = false;
  const merged = {...local};
  for (const date in remote) {
    if (JSON.stringify(merged[date]) !== JSON.stringify(remote[date])) { merged[date] = remote[date]; changed = true; }
  }
  return changed ? merged : local;
}
// ID 기반 배열 병합. 변경 없으면 같은 참조 반환
function mergeById(local, remote) {
  if (!remote?.length) return local || [];
  if (!local?.length) return remote;
  const localIds = new Set(local.map((item) => item.id));
  const newItems = remote.filter((item) => !localIds.has(item.id));
  // 기존 항목 업데이트 체크
  let updated = false;
  const merged = local.map((item) => {
    const ri = remote.find((r) => r.id === item.id);
    if (ri && JSON.stringify(ri) !== JSON.stringify(item)) { updated = true; return {...item, ...ri}; }
    return item;
  });
  if (newItems.length) return [...merged, ...newItems];
  return updated ? merged : local;
}
// entries: 날짜별 병합
function mergeEntries(local, remote) {
  if (!remote) return local || {};
  if (!local || !Object.keys(local).length) return remote;
  let changed = false;
  const merged = {...local};
  for (const date in remote) {
    if (JSON.stringify(merged[date]) !== JSON.stringify(remote[date])) { merged[date] = remote[date]; changed = true; }
  }
  return changed ? merged : local;
}

// ===================== Gist API =====================
async function gistRead(token, gistId) {
  const res = await fetch(`https://api.github.com/gists/${gistId}?_t=${Date.now()}`, {
    cache: "no-store",
    headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json" },
  });
  if (!res.ok) throw new Error(`Gist 읽기 실패 (${res.status})`);
  const data = await res.json();
  const file = data.files && data.files[GIST_FILENAME];
  if (!file) throw new Error("Gist에 데이터 파일이 없어요.");
  return JSON.parse(file.content);
}
async function gistWrite(token, gistId, payload) {
  const body = JSON.stringify({
    files: { [GIST_FILENAME]: { content: JSON.stringify(payload) } },
  });
  if (gistId) {
    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      method: "PATCH",
      headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
      body,
    });
    if (!res.ok) { const t = await res.text().catch(()=>""); throw new Error(`Gist 저장 실패 (${res.status}) ${t.substring(0,200)}`); }
    return (await res.json()).id;
  } else {
    const res = await fetch("https://api.github.com/gists", {
      method: "POST",
      headers: { Authorization: `token ${token}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify({
        description: "작업 일지 트래커 데이터",
        public: false,
        files: { [GIST_FILENAME]: { content: JSON.stringify(payload) } },
      }),
    });
    if (!res.ok) throw new Error(`Gist 생성 실패 (${res.status})`);
    return (await res.json()).id;
  }
}

// ===================== 메인 앱 =====================
function App() {
  const isMobile = useMemo(() => window.matchMedia("(max-width: 768px)").matches, []);
  const savedTab = useMemo(() => localStorage.getItem(LS_LAST_TAB), []);
  const [tab, setTab] = useState(savedTab || (isMobile ? "orbs" : "log"));
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [entries, setEntries] = useState({});
  const [alarms, setAlarms] = useState([]);
  const [orbCategories, setOrbCategories] = useState(DEFAULT_ORB_CATEGORIES);
  const [actions, setActions] = useState([]);
  const [orbs, setOrbs] = useState({});
  const [archives, setArchives] = useState({});
  const [currentDate, setCurrentDate] = useState(todayStr);
  const [cursor, setCursor] = useState(() => { const n = new Date(); return { year: n.getFullYear(), month: n.getMonth() }; });
  const [selectedDate, setSelectedDate] = useState(null);
  const [manageOpen, setManageOpen] = useState(false);
  const [orbManageOpen, setOrbManageOpen] = useState(false);
  const [syncOpen, setSyncOpen] = useState(false);

  const [token, setToken] = useState(() => localStorage.getItem(LS_TOKEN) || "");
  const [gistId, setGistId] = useState(() => localStorage.getItem(LS_GISTID) || "");
  const [syncState, setSyncState] = useState("idle");
  const [syncMsg, setSyncMsg] = useState("");
  const loadedRef = useRef(false);
  const gistReadyRef = useRef(false);
  const writeTimer = useRef(null);
  const pendingPayloadRef = useRef(null);
  const lastWrittenAtRef = useRef(0);
  const [syncVersion, setSyncVersion] = useState(0);

  useEffect(() => { localStorage.setItem(LS_LAST_TAB, tab); }, [tab]);

  // 자정 리셋
  useEffect(() => {
    let lastDate = todayStr();
    const interval = setInterval(() => {
      const now = todayStr();
      if (now !== lastDate) {
        if (now.substring(0,7) !== lastDate.substring(0,7)) {
          setArchives((prev) => ({...prev, [lastDate.substring(0,7)]: { closedAt: Date.now() }}));
        }
        lastDate = now;
        setCurrentDate(now);
      }
    }, 60000);
    return () => clearInterval(interval);
  }, []);

  // 앱으로 돌아올 때 Gist 자동 재동기화
  useEffect(() => {
    let lastHidden = 0;
    const onVisible = () => {
      if (document.hidden) { lastHidden = Date.now(); return; }
      const away = Date.now() - lastHidden;
      const t = token || localStorage.getItem(LS_TOKEN);
      const g = gistId || localStorage.getItem(LS_GISTID);
      if (!t || !g || away < 3000) return; // 3초 이상 떠난 경우만
      setSyncState("syncing"); setSyncMsg("불러오는 중…");
      gistRead(t, g)
        .then((remote) => {
          if (remote.categories?.length) setCategories(remote.categories);
          if (remote.entries) setEntries((prev) => mergeEntries(prev, remote.entries));
          if (remote.alarms) setAlarms(remote.alarms);
          if (remote.orbCategories?.length) setOrbCategories((prev) => mergeById(prev, remote.orbCategories));
          if (remote.actions) setActions((prev) => mergeById(prev, remote.actions));
          setOrbs((prev) => mergeOrbs(prev, remote.orbs || {}));
          if (remote.archives) setArchives((prev) => { const m = {...prev, ...remote.archives}; return JSON.stringify(m) !== JSON.stringify(prev) ? m : prev; });
          if (remote.updatedAt) lastWrittenAtRef.current = Math.max(lastWrittenAtRef.current, remote.updatedAt);
          setSyncVersion((v) => v + 1);
          setSyncState("ok"); setSyncMsg("동기화됨 ✓");
          setTimeout(() => setSyncState("idle"), 1600);
        })
        .catch(() => { setSyncState("warn"); setSyncMsg("동기화 실패"); });
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [token, gistId]);

  // 초기 로드
  useEffect(() => {
    try {
      const raw = localStorage.getItem(LS_DATA);
      if (raw) {
        const data = JSON.parse(raw);
        if (data.categories?.length) setCategories(data.categories);
        if (data.entries) setEntries(data.entries);
        if (data.alarms) setAlarms(data.alarms);
        if (data.orbCategories?.length) setOrbCategories(data.orbCategories);
        if (Array.isArray(data.actions)) setActions(data.actions);
        if (data.orbs) setOrbs(data.orbs);
        if (data.archives) setArchives(data.archives);
      }
    } catch (e) {}
    loadedRef.current = true;

    if (token && gistId) {
      setSyncState("syncing"); setSyncMsg("불러오는 중…");
      gistRead(token, gistId)
        .then((remote) => {
          if (remote.categories?.length) setCategories(remote.categories);
          if (remote.entries) setEntries((prev) => mergeEntries(prev, remote.entries));
          if (remote.alarms) setAlarms(remote.alarms);
          if (remote.orbCategories?.length) setOrbCategories((prev) => mergeById(prev, remote.orbCategories));
          if (remote.actions) setActions((prev) => mergeById(prev, remote.actions));
          setOrbs((prev) => mergeOrbs(prev, remote.orbs || {}));
          if (remote.archives) setArchives((prev) => { const m = {...prev, ...remote.archives}; return JSON.stringify(m) !== JSON.stringify(prev) ? m : prev; });
          if (remote.updatedAt) lastWrittenAtRef.current = Math.max(lastWrittenAtRef.current, remote.updatedAt);
          gistReadyRef.current = true;
          setSyncVersion((v) => v + 1);
          setSyncState("ok"); setSyncMsg("동기화됨 ✓");
          setTimeout(() => setSyncState("idle"), 1600);
        })
        .catch((err) => { gistReadyRef.current = true; setSyncState("warn"); setSyncMsg("동기화 실패"); console.warn(err); });
    } else {
      gistReadyRef.current = true;
    }
  }, []); // eslint-disable-line

  // 저장
  useEffect(() => {
    if (!loadedRef.current) return;
    const payload = { categories, entries, alarms, orbCategories, actions, orbs, archives, updatedAt: Date.now() };
    try { localStorage.setItem(LS_DATA, JSON.stringify(payload)); } catch (e) {}

    if (token && gistReadyRef.current) {
      pendingPayloadRef.current = payload;
      if (writeTimer.current) clearTimeout(writeTimer.current);
      setSyncState("syncing"); setSyncMsg("저장 중…");
      writeTimer.current = setTimeout(async () => {
        pendingPayloadRef.current = null;
        try {
          const newId = await gistWrite(token, gistId, payload);
          lastWrittenAtRef.current = payload.updatedAt;
          if (!gistId && newId) { setGistId(newId); localStorage.setItem(LS_GISTID, newId); }
          setSyncState("ok"); setSyncMsg("동기화됨 ✓");
          setTimeout(() => setSyncState("idle"), 1600);
        } catch (err) { setSyncState("warn"); setSyncMsg("저장 실패: " + (err.message || err).toString().substring(0, 80)); console.warn(err); }
      }, 1200);
    }
  }, [categories, entries, alarms, orbCategories, actions, orbs, archives, token, gistId, syncVersion]);

  // 앱 이탈 시 미저장 Gist 즉시 전송
  useEffect(() => {
    const flushPending = () => {
      const p = pendingPayloadRef.current;
      const t = token || localStorage.getItem(LS_TOKEN);
      const g = gistId || localStorage.getItem(LS_GISTID);
      if (!p || !t || !g) return;
      pendingPayloadRef.current = null;
      if (writeTimer.current) { clearTimeout(writeTimer.current); writeTimer.current = null; }
      const body = JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify(p) } } });
      try {
        fetch(`https://api.github.com/gists/${g}`, {
          method: "PATCH", keepalive: true,
          headers: { Authorization: `token ${t}`, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
          body,
        });
      } catch (e) {}
    };
    const onVisChange = () => { if (document.hidden) flushPending(); };
    document.addEventListener("visibilitychange", onVisChange);
    window.addEventListener("beforeunload", flushPending);
    return () => {
      document.removeEventListener("visibilitychange", onVisChange);
      window.removeEventListener("beforeunload", flushPending);
    };
  }, [token, gistId]);

  // 30초마다 Gist 폴링 — 다른 기기의 변경 자동 감지
  useEffect(() => {
    const t = token, g = gistId;
    if (!t || !g) return;
    const poll = setInterval(() => {
      if (pendingPayloadRef.current) return; // 저장 중이면 건너뜀
      gistRead(t, g)
        .then((remote) => {
          if (!remote.updatedAt || remote.updatedAt <= lastWrittenAtRef.current) return;
          // 다른 기기가 더 최근에 저장함 → 병합
          lastWrittenAtRef.current = remote.updatedAt;
          if (remote.categories?.length) setCategories(remote.categories);
          if (remote.entries) setEntries((prev) => mergeEntries(prev, remote.entries));
          if (remote.alarms) setAlarms(remote.alarms);
          if (remote.orbCategories?.length) setOrbCategories((prev) => mergeById(prev, remote.orbCategories));
          if (remote.actions) setActions((prev) => mergeById(prev, remote.actions));
          setOrbs((prev) => mergeOrbs(prev, remote.orbs || {}));
          if (remote.archives) setArchives((prev) => { const m = {...prev, ...remote.archives}; return JSON.stringify(m) !== JSON.stringify(prev) ? m : prev; });
          setSyncVersion((v) => v + 1);
        })
        .catch(() => {});
    }, 30000);
    return () => clearInterval(poll);
  }, [token, gistId]);

  // 월 그리드
  const monthInfo = useMemo(() => {
    const { year, month } = cursor;
    const first = new Date(year, month, 1);
    const startWeekday = first.getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const cells = [];
    for (let i=0; i<startWeekday; i++) cells.push(null);
    for (let d=1; d<=daysInMonth; d++) cells.push(new Date(year, month, d));
    while (cells.length % 7 !== 0) cells.push(null);
    const weeks = [];
    for (let i=0; i<cells.length; i+=7) weeks.push(cells.slice(i, i+7));
    return { weeks, daysInMonth, year, month };
  }, [cursor]);

  const activeCategories = useMemo(() => {
    const { year, month } = cursor;
    const present = new Set();
    for (const ds in entries) {
      const d = parseYmd(ds);
      if (d.getFullYear()===year && d.getMonth()===month) {
        const day = entries[ds];
        for (const cid in day) { const c = day[cid]; if (c && (c.note?.trim() || c.words || c.done)) present.add(cid); }
      }
    }
    return categories.filter((c) => present.has(c.id));
  }, [entries, categories, cursor]);

  const hasEntryOn = useCallback((cid, dateStr) => {
    const day = entries[dateStr]; if (!day || !day[cid]) return false;
    const c = day[cid]; return !!(c.note?.trim() || c.words || c.done);
  }, [entries]);

  const dayHasAny = useCallback((dateStr) => {
    const day = entries[dateStr]; if (!day) return [];
    return categories.filter((c) => day[c.id] && (day[c.id].note?.trim() || day[c.id].words || day[c.id].done)).map((c) => c.color);
  }, [entries, categories]);

  const dayWordCount = useCallback((dateStr) => {
    const day = entries[dateStr]; if (!day) return 0;
    let sum = 0;
    for (const cid in day) { if (day[cid]?.words) sum += day[cid].words; }
    return sum;
  }, [entries]);

  const addCategory = (name, isWork) => {
    const used = new Set(categories.map((c) => c.color));
    const color = PALETTE.find((p) => !used.has(p)) || PALETTE[categories.length % PALETTE.length];
    setCategories((prev) => [...prev, { id: uid("c"), name, color, isWork }]);
  };
  const updateCategory = (id, patch) => setCategories((prev) => prev.map((c) => c.id===id ? {...c,...patch} : c));
  const removeCategory = (id) => setCategories((prev) => prev.filter((c) => c.id!==id));
  const reorderCategory = (fromId, toId) => setCategories((prev) => {
    if (fromId === toId) return prev;
    const arr = [...prev];
    const from = arr.findIndex((c) => c.id === fromId);
    const to = arr.findIndex((c) => c.id === toId);
    if (from < 0 || to < 0) return prev;
    const [moved] = arr.splice(from, 1);
    arr.splice(to, 0, moved);
    return arr;
  });

  const saveDayEntry = (dateStr, perCat) => {
    setEntries((prev) => {
      const next = {...prev}; const cleaned = {};
      for (const cid in perCat) {
        const c = perCat[cid];
        if (c && (c.note?.trim() || c.words || c.done)) cleaned[cid] = { note: c.note?.trim()||"", ...(c.words ? {words: c.words} : {}), ...(c.done ? {done: true} : {}) };
      }
      if (Object.keys(cleaned).length===0) delete next[dateStr]; else next[dateStr] = cleaned;
      return next;
    });
  };

  const addWorkRecord = (dateStr, catId, words, note) => {
    if (!catId) return;
    setEntries((prev) => {
      const next = {...prev};
      const day = {...(next[dateStr] || {})};
      const existing = day[catId] || { note: "", words: 0 };
      const mergedNote = [existing.note, note].filter((s) => s && s.trim()).join(" / ");
      day[catId] = {
        note: mergedNote,
        words: (existing.words || 0) + (words || 0),
        ...(existing.done ? { done: true } : {}),
      };
      next[dateStr] = day;
      return next;
    });
  };

  // 구슬 카테고리 관리
  const addOrbCategory = (name) => {
    const used = new Set(orbCategories.map((c) => c.color));
    const color = PALETTE.find((p) => !used.has(p)) || PALETTE[orbCategories.length % PALETTE.length];
    setOrbCategories((prev) => [...prev, { id: uid("oc"), name, color }]);
  };
  const updateOrbCategory = (id, patch) => setOrbCategories((prev) => prev.map((c) => c.id===id ? {...c,...patch} : c));
  const removeOrbCategory = (id) => {
    setOrbCategories((prev) => prev.filter((c) => c.id!==id));
    setActions((prev) => prev.filter((a) => a.categoryId !== id));
  };

  // 행동 관리
  const addAction = (catId, name, icon) => {
    setActions((prev) => [...prev, { id: uid("a"), categoryId: catId, name, icon: icon || "", isSpecial: false, isRoutine: false }]);
  };
  const updateAction = (id, patch) => setActions((prev) => prev.map((a) => a.id===id ? {...a,...patch} : a));
  const removeAction = (id) => setActions((prev) => prev.filter((a) => a.id!==id));

  // 구슬 추가
  const addOrb = useCallback((categoryId, actionId, size, special) => {
    const ds = currentDate;
    setOrbs((prev) => {
      const next = {...prev};
      const day = [...(next[ds] || [])];
      day.push({ id: uid("o"), categoryId, actionId, size, special: !!special, t: Date.now() });
      next[ds] = day;
      return next;
    });
  }, [currentDate]);

  const removeLastOrb = useCallback(() => {
    const ds = currentDate;
    setOrbs((prev) => {
      const day = prev[ds];
      if (!day || day.length === 0) return prev;
      const next = {...prev};
      next[ds] = day.slice(0, -1);
      if (next[ds].length === 0) delete next[ds];
      return next;
    });
  }, [currentDate]);

  // 황금 구슬 수 계산
  const goldenForMonth = useCallback((ym) => {
    let count = 0;
    for (const ds in orbs) {
      if (ds.startsWith(ym)) {
        count += orbs[ds].filter((o) => o.special).length;
      }
    }
    return count;
  }, [orbs]);

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ categories, entries, orbCategories, actions, orbs, archives }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `worklog-backup-${todayStr()}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try { const data = JSON.parse(reader.result);
        if (data.categories?.length) setCategories(data.categories);
        if (data.entries) setEntries(data.entries);
        if (data.orbCategories?.length) setOrbCategories(data.orbCategories);
        if (Array.isArray(data.actions)) setActions(data.actions);
        if (data.orbs) setOrbs(data.orbs);
        if (data.archives) setArchives(data.archives);
      } catch (e) { alert("백업 파일을 읽을 수 없어요."); }
    };
    reader.readAsText(file);
  };

  const monthStats = useMemo(() => {
    const { year, month } = cursor;
    const activeDays = new Set(); let totalWords = 0;
    for (const ds in entries) {
      const d = parseYmd(ds);
      if (d.getFullYear()===year && d.getMonth()===month) {
        const day = entries[ds]; let counted = false;
        for (const cid in day) { const c = day[cid]; if (c && (c.note?.trim() || c.words || c.done)) counted = true; if (c?.words) totalWords += c.words; }
        if (counted) activeDays.add(ds);
      }
    }
    return { activeDays: activeDays.size, totalWords };
  }, [entries, cursor]);

  const prevMonth = () => setCursor((c) => { const m = c.month-1; return m<0 ? {year:c.year-1, month:11} : {year:c.year, month:m}; });
  const nextMonth = () => setCursor((c) => { const m = c.month+1; return m>11 ? {year:c.year+1, month:0} : {year:c.year, month:m}; });

  const connectGist = (newToken, newGistId) => {
    setToken(newToken); localStorage.setItem(LS_TOKEN, newToken);
    if (newGistId) { setGistId(newGistId); localStorage.setItem(LS_GISTID, newGistId); }
    gistReadyRef.current = false;
    setSyncState("syncing"); setSyncMsg("연결 중…");
    gistRead(newToken, newGistId || gistId)
      .then((remote) => {
        if (remote.categories?.length) setCategories(remote.categories);
        if (remote.entries) setEntries((prev) => mergeEntries(prev, remote.entries));
        if (remote.alarms) setAlarms(remote.alarms);
        if (remote.orbCategories?.length) setOrbCategories((prev) => mergeById(prev, remote.orbCategories));
        if (remote.actions) setActions((prev) => mergeById(prev, remote.actions));
        setOrbs((prev) => mergeOrbs(prev, remote.orbs || {}));
        if (remote.archives) setArchives((prev) => ({...prev, ...remote.archives}));
        if (remote.updatedAt) lastWrittenAtRef.current = Math.max(lastWrittenAtRef.current, remote.updatedAt);
        gistReadyRef.current = true;
        setSyncVersion((v) => v + 1);
        setSyncState("ok"); setSyncMsg("동기화됨 ✓"); setTimeout(() => setSyncState("idle"), 1600);
      })
      .catch(() => {
        gistReadyRef.current = true;
        setSyncState("idle"); setSyncMsg("");
      });
  };
  const disconnectGist = () => {
    setToken(""); setGistId("");
    localStorage.removeItem(LS_TOKEN); localStorage.removeItem(LS_GISTID);
    setSyncState("idle"); setSyncMsg("");
  };

  const syncClass = { idle: "sync-idle", syncing: "sync-sync", ok: "sync-ok", warn: "sync-warn" }[syncState];

  const titles = { log: "작업 일지", orbs: "오늘의 구슬", alarm: "거짓 경보", archive: "아카이브" };
  const subtitles = { log: "매일의 작업을 기록하고, 이어지는 흐름을 봅니다", orbs: "오두막 일지 — 오늘 한 일을 구슬로 모아요", alarm: "시작 전 공포와 실제 사이의 거리를 기록해요", archive: "황금 구슬이 모이는 보관함" };

  return (
    <div className="wrap">
      <header>
        <div>
          <h1>{titles[tab]}</h1>
          <p className="subtitle">{subtitles[tab]} <span style={{ color: "var(--faint)", fontSize: 10, marginLeft: 4 }}>v{BUILD}</span></p>
        </div>
        <div className="header-right">
          <span className={`sync-badge ${syncClass}`}>{syncMsg}</span>
          <button className="ghost-btn" onClick={() => setSyncOpen(true)}>{token ? "동기화 ✓" : "동기화"}</button>
          {tab==="log" && <button className="ghost-btn" onClick={() => setManageOpen(true)}>항목 관리</button>}
          {tab==="orbs" && <button className="ghost-btn" onClick={() => setOrbManageOpen(true)}>구슬 관리</button>}
        </div>
      </header>

      <div className="tab-bar">
        <button className={`tab-btn${tab==="log" ? " on" : ""}`} onClick={() => setTab("log")}>작업 일지</button>
        <button className={`tab-btn${tab==="orbs" ? " on-green" : ""}`} onClick={() => setTab("orbs")}>구슬</button>
        <button className={`tab-btn${tab==="alarm" ? " on" : ""}`} onClick={() => setTab("alarm")}>거짓 경보</button>
        <button className={`tab-btn${tab==="archive" ? " on-green" : ""}`} onClick={() => setTab("archive")}>보관함</button>
      </div>

      {tab==="log" && (<React.Fragment>
      <div className="month-bar">
        <button className="nav-btn" onClick={prevMonth} aria-label="이전 달">‹</button>
        <div className="month-label">
          <span className="month-year">{cursor.year}</span>
          <span className="month-name">{MONTHS[cursor.month]}</span>
        </div>
        <button className="nav-btn" onClick={nextMonth} aria-label="다음 달">›</button>
      </div>

      <div className="stats-row">
        <div className="stat"><div className="stat-num">{monthStats.activeDays}</div><div className="stat-label">작업한 날</div></div>
        <div className="stat"><div className="stat-num">{monthStats.totalWords.toLocaleString()}</div><div className="stat-label">이번 달 글자 수</div></div>
        <div className="stat"><div className="stat-num">{activeCategories.length}</div><div className="stat-label">진행 항목</div></div>
      </div>

      <section className="card">
        <div className="week-header">
          {WEEKDAYS.map((w, i) => (
            <div key={w} className="week-header-cell" style={{ color: i===0 ? "#e94560" : i===6 ? "#818cf8" : "#6b8a7e" }}>{w}</div>
          ))}
        </div>
        {monthInfo.weeks.map((week, wi) => (
          <div key={wi} className="week-row">
            {week.map((date, di) => {
              if (!date) return <div key={di} className="day-empty" />;
              const ds = ymd(date); const colors = dayHasAny(ds); const words = dayWordCount(ds); const isToday = ds===currentDate;
              return (
                <button key={di} className={`day${isToday ? " today" : ""}`} onClick={() => setSelectedDate(ds)}>
                  <span className="day-num" style={{ color: di===0 ? "#e94560" : di===6 ? "#818cf8" : "#2a3d36", fontWeight: isToday ? 800 : 500 }}>{date.getDate()}</span>
                  <div className="day-words">
                    {words > 0
                      ? <span className="words-count">{words >= 1000 ? (words/1000).toFixed(words % 1000 === 0 ? 0 : 1) + "k" : words}</span>
                      : (colors.length > 0 ? <span className="words-dot" /> : null)}
                  </div>
                </button>
              );
            })}
          </div>
        ))}
      </section>

      <section className="card">
        <div className="gant-title">이어지는 작업 흐름</div>
        {activeCategories.length===0 ? (
          <div className="empty">이번 달 기록이 아직 없어요. 날짜를 눌러 기록을 시작하세요.</div>
        ) : (
          <div className="gant-scroll">
            <div style={{ minWidth: 92 + monthInfo.daysInMonth*22 }}>
              <div className="gant-axis">
                <div className="gant-row-label" />
                <div className="gant-track">
                  {Array.from({length: monthInfo.daysInMonth}, (_, i) => i+1).map((d) => (
                    <div key={d} className="gant-tick">{d % 2===1 ? d : ""}</div>
                  ))}
                </div>
              </div>
              {activeCategories.map((cat) => (
                <div key={cat.id} className="gant-row">
                  <div className="gant-row-label" title={cat.name}>
                    <span className="gant-swatch" style={{ background: cat.color }} />
                    <span className="gant-name">{cat.name}</span>
                  </div>
                  <div className="gant-track">
                    {Array.from({length: monthInfo.daysInMonth}, (_, i) => i+1).map((d) => {
                      const ds = ymd(new Date(cursor.year, cursor.month, d));
                      const on = hasEntryOn(cat.id, ds);
                      const prevOn = d>1 && hasEntryOn(cat.id, ymd(new Date(cursor.year, cursor.month, d-1)));
                      const nextOn = d<monthInfo.daysInMonth && hasEntryOn(cat.id, ymd(new Date(cursor.year, cursor.month, d+1)));
                      return (
                        <div key={d} className="gant-cell">
                          {on && (
                            <div title={`${cat.name} · ${cursor.month+1}/${d}`} className="gant-bar" style={{
                              background: cat.color,
                              borderTopLeftRadius: prevOn ? 0 : 6, borderBottomLeftRadius: prevOn ? 0 : 6,
                              borderTopRightRadius: nextOn ? 0 : 6, borderBottomRightRadius: nextOn ? 0 : 6,
                              marginLeft: prevOn ? -2 : 0, marginRight: nextOn ? -2 : 0,
                            }} />
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </section>

      <div className="backup-row">
        <button className="ghost-btn" onClick={exportData}>백업 내보내기</button>
        <label className="ghost-btn">백업 가져오기
          <input type="file" accept="application/json" style={{ display: "none" }} onChange={(e) => e.target.files[0] && importData(e.target.files[0])} />
        </label>
      </div>
      </React.Fragment>)}

      {tab==="orbs" && (
        <OrbsTab currentDate={currentDate} orbCategories={orbCategories} actions={actions} orbs={orbs}
          onAddOrb={addOrb} onRemoveLastOrb={removeLastOrb} onAddAction={addAction} onManage={() => setOrbManageOpen(true)} />
      )}

      {tab==="alarm" && (
        <AlarmTab alarms={alarms} workCats={categories.filter((c) => c.isWork)} onAddWork={addWorkRecord}
          onAdd={(rec) => setAlarms((prev) => [...prev, rec])} onClear={() => setAlarms([])} />
      )}

      {tab==="archive" && (
        <ArchiveTab orbs={orbs} archives={archives} orbCategories={orbCategories} currentDate={currentDate} goldenForMonth={goldenForMonth} />
      )}

      {selectedDate && (
        <DayEditor dateStr={selectedDate} categories={categories} entry={entries[selectedDate] || {}}
          onClose={() => setSelectedDate(null)}
          onSave={(perCat) => { saveDayEntry(selectedDate, perCat); setSelectedDate(null); }} />
      )}
      {manageOpen && (
        <CategoryManager categories={categories} onAdd={addCategory} onUpdate={updateCategory} onRemove={removeCategory} onReorder={reorderCategory} onClose={() => setManageOpen(false)} />
      )}
      {orbManageOpen && (
        <OrbActionManager orbCategories={orbCategories} actions={actions}
          onAddCategory={addOrbCategory} onUpdateCategory={updateOrbCategory} onRemoveCategory={removeOrbCategory}
          onAddAction={addAction} onUpdateAction={updateAction} onRemoveAction={removeAction}
          onClose={() => setOrbManageOpen(false)} />
      )}
      {syncOpen && (
        <SyncManager token={token} gistId={gistId} onConnect={connectGist} onDisconnect={disconnectGist} onClose={() => setSyncOpen(false)} localOrbs={orbs} localEntries={entries} />
      )}
    </div>
  );
}

// ===================== 날짜 기록 편집기 =====================
function DayEditor({ dateStr, categories, entry, onClose, onSave }) {
  const d = parseYmd(dateStr);
  const [draft, setDraft] = useState(() => {
    const init = {};
    categories.forEach((c) => { const e = entry[c.id] || {}; init[c.id] = { note: e.note||"", words: e.words||"", done: e.done||false }; });
    return init;
  });
  const setField = (cid, field, val) => setDraft((prev) => ({...prev, [cid]: {...prev[cid], [field]: val}}));
  const handleSave = () => {
    const out = {};
    categories.forEach((c) => {
      const e = draft[c.id]; const words = e.words==="" ? 0 : parseInt(e.words,10)||0;
      out[c.id] = { note: e.note, ...(c.isWork && words ? {words} : {}), ...(!c.isWork && e.done ? {done: true} : {}) };
    });
    onSave(out);
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <div>
            <div className="modal-date">{d.getMonth()+1}월 {d.getDate()}일</div>
            <div className="modal-weekday">{WEEKDAYS[d.getDay()]}요일 · {d.getFullYear()}</div>
          </div>
          <button className="close-btn" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {categories.map((c) => (
            <div key={c.id} className="entry-block">
              <div className="entry-head">
                <span className="entry-swatch" style={{ background: c.color }} />
                <span className="entry-name">{c.name}</span>
                {c.isWork && <span className="work-tag">작품</span>}
              </div>
              <textarea className="textarea" placeholder="오늘 한 일…" rows={2}
                value={draft[c.id].note} onChange={(e) => setField(c.id, "note", e.target.value)} />
              {c.isWork && (
                <div className="words-row">
                  <input className="words-input" type="number" min="0" placeholder="0"
                    value={draft[c.id].words} onChange={(e) => setField(c.id, "words", e.target.value)} />
                  <span className="words-label">자 작성</span>
                </div>
              )}
              {!c.isWork && (
                <label className="words-row" style={{ cursor: "pointer", userSelect: "none" }}>
                  <input type="checkbox" checked={draft[c.id].done}
                    onChange={(e) => setField(c.id, "done", e.target.checked)}
                    style={{ width: 18, height: 18, accentColor: "var(--accent)" }} />
                  <span className="words-label">완료로 표시</span>
                </label>
              )}
            </div>
          ))}
        </div>
        <div className="modal-foot">
          <button className="ghost-btn" onClick={onClose}>취소</button>
          <button className="primary-btn" onClick={handleSave}>저장</button>
        </div>
      </div>
    </div>
  );
}

// ===================== 항목 관리 =====================
function CategoryManager({ categories, onAdd, onUpdate, onRemove, onReorder, onClose }) {
  const [name, setName] = useState(""); const [isWork, setIsWork] = useState(true);
  const [dragId, setDragId] = useState(null);
  const [overId, setOverId] = useState(null);
  const [pickerId, setPickerId] = useState(null);
  const handleAdd = () => { if (!name.trim()) return; onAdd(name.trim(), isWork); setName(""); };

  const move = (id, dir) => {
    const i = categories.findIndex((c) => c.id === id);
    const j = i + dir;
    if (j < 0 || j >= categories.length) return;
    onReorder(id, categories[j].id);
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><div className="modal-date">항목 관리</div><button className="close-btn" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <div className="add-row">
            <input className="add-input" placeholder="새 항목 이름 (예: 작품 4)" value={name}
              onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key==="Enter" && handleAdd()} />
            <button className={`toggle-btn${isWork ? " on" : ""}`} onClick={() => setIsWork((v) => !v)}>{isWork ? "작품 ✓" : "일반"}</button>
            <button className="primary-btn" onClick={handleAdd}>추가</button>
          </div>
          <p className="hint">색칠된 사각형을 누르면 색을 바꿀 수 있어요. 손잡이를 끌거나 버튼으로 순서를 바꿉니다.</p>
          <div className="cat-list">
            {categories.map((c, idx) => (
              <div key={c.id}
                className={`cat-item${overId===c.id && dragId && dragId!==c.id ? " drag-over" : ""}${dragId===c.id ? " dragging" : ""}`}
                draggable
                onDragStart={() => setDragId(c.id)}
                onDragEnter={() => setOverId(c.id)}
                onDragOver={(e) => e.preventDefault()}
                onDrop={() => { if (dragId) onReorder(dragId, c.id); setDragId(null); setOverId(null); }}
                onDragEnd={() => { setDragId(null); setOverId(null); }}
              >
                <span className="drag-handle" title="끌어서 순서 변경">⋮⋮</span>
                <div className="reorder-btns">
                  <button className="reorder-btn" onClick={() => move(c.id, -1)} disabled={idx===0} aria-label="위로">↑</button>
                  <button className="reorder-btn" onClick={() => move(c.id, 1)} disabled={idx===categories.length-1} aria-label="아래로">↓</button>
                </div>
                <button className="swatch-btn" style={{ background: c.color }} onClick={() => setPickerId(pickerId===c.id ? null : c.id)} aria-label="색 바꾸기" />
                <input className="cat-name-input" value={c.name} onChange={(e) => onUpdate(c.id, { name: e.target.value })} />
                <button className={`mini-tag${c.isWork ? " on" : ""}`} onClick={() => onUpdate(c.id, { isWork: !c.isWork })}>{c.isWork ? "작품" : "일반"}</button>
                <button className="del-btn" onClick={() => onRemove(c.id)} aria-label="삭제">×</button>
                {pickerId===c.id && (
                  <div className="color-pop" onClick={(e) => e.stopPropagation()}>
                    <div className="color-grid">
                      {PALETTE.map((p) => (
                        <button key={p} className={`color-cell${c.color===p ? " sel" : ""}`} style={{ background: p }}
                          onClick={() => { onUpdate(c.id, { color: p }); setPickerId(null); }} aria-label={p} />
                      ))}
                    </div>
                    <label className="color-custom">
                      직접 고르기
                      <input type="color" value={c.color} onChange={(e) => onUpdate(c.id, { color: e.target.value })} />
                    </label>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
        <div className="modal-foot"><button className="primary-btn" onClick={onClose}>완료</button></div>
      </div>
    </div>
  );
}

// ===================== 동기화 설정 =====================
function SyncManager({ token, gistId, onConnect, onDisconnect, onClose, localOrbs, localEntries }) {
  const [t, setT] = useState(token); const [g, setG] = useState(gistId);
  const [diag, setDiag] = useState(null);
  const handleConnect = () => { if (!t.trim()) { alert("토큰을 입력해 주세요."); return; } onConnect(t.trim(), g.trim()); };
  const runDiag = async () => {
    if (!token || !gistId) { setDiag("동기화 미연결"); return; }
    setDiag("Gist 읽는 중…");
    try {
      const remote = await gistRead(token, gistId);
      const localOrbDates = Object.keys(localOrbs || {});
      const localOrbTotal = localOrbDates.reduce((s, d) => s + (localOrbs[d]?.length || 0), 0);
      const remoteOrbs = remote.orbs || {};
      const remoteOrbDates = Object.keys(remoteOrbs);
      const remoteOrbTotal = remoteOrbDates.reduce((s, d) => s + (remoteOrbs[d]?.length || 0), 0);
      const localEntryDates = Object.keys(localEntries || {});
      const remoteEntryDates = Object.keys(remote.entries || {});
      const ts = remote.updatedAt ? new Date(remote.updatedAt).toLocaleString() : "없음";
      setDiag(
        `[v8] Gist 최종 수정: ${ts}\n` +
        `\n📋 작업일지: 로컬 ${localEntryDates.length}일 / Gist ${remoteEntryDates.length}일` +
        `\n🔮 구슬: 로컬 ${localOrbTotal}개(${localOrbDates.length}일) / Gist ${remoteOrbTotal}개(${remoteOrbDates.length}일)` +
        `\n\n로컬 구슬 날짜: ${localOrbDates.join(", ") || "(없음)"}` +
        `\nGist 구슬 날짜: ${remoteOrbDates.join(", ") || "(없음)"}` +
        (localOrbDates.length ? localOrbDates.map(d => `\n  ${d}: 로컬 ${localOrbs[d]?.length || 0}개 / Gist ${remoteOrbs[d]?.length || 0}개`).join("") : "")
      );
    } catch (e) { setDiag("진단 실패: " + e.message); }
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><div className="modal-date">기기 간 동기화</div><button className="close-btn" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <p className="status-note">
            GitHub 토큰을 입력하면 기록이 본인의 비공개 Gist에 저장돼서, 폰·노트북 어디서든 같은 기록을 볼 수 있어요.
            토큰은 이 기기 브라우저에만 저장됩니다.
          </p>
          <div className="field-label">GitHub 토큰 (gist 권한)</div>
          <input className="add-input" style={{ width: "100%" }} type="password" placeholder="ghp_..." value={t} onChange={(e) => setT(e.target.value)} />
          <div className="field-label">Gist ID (선택 — 다른 기기에서 연결할 때)</div>
          <input className="add-input" style={{ width: "100%" }} placeholder="비워두면 새로 만들어요" value={g} onChange={(e) => setG(e.target.value)} />
          <p className="status-note">
            <b>처음 설정</b>: 토큰만 넣고 연결하면 새 Gist가 자동 생성돼요. 생성 후 이 화면의 Gist ID를 확인해 다른 기기에 입력하세요.<br/>
            <b>토큰 만들기</b>: GitHub → Settings → Developer settings → Personal access tokens → <i>Tokens (classic)</i>에서 <b>gist</b> 권한만 체크해 발급.
          </p>
          {gistId && <p className="status-note">현재 Gist ID: <b>{gistId}</b></p>}
          {token && gistId && <button className="ghost-btn" style={{marginTop:8,width:"100%"}} onClick={runDiag}>🔍 동기화 진단</button>}
          {diag && <pre className="status-note" style={{whiteSpace:"pre-wrap",background:"#d8efe6",padding:8,borderRadius:6,fontSize:11,marginTop:8,lineHeight:1.5}}>{diag}</pre>}
        </div>
        <div className="modal-foot">
          {token && <button className="ghost-btn" onClick={() => { onDisconnect(); onClose(); }}>연결 해제</button>}
          <button className="primary-btn" onClick={handleConnect}>연결</button>
        </div>
      </div>
    </div>
  );
}


// ===================== 거짓 경보 탭 =====================
function AlarmTab({ alarms, workCats, onAddWork, onAdd, onClear }) {
  const [step, setStep] = useState(1);
  const [fear, setFear] = useState(null);
  const [real, setReal] = useState(null);
  const [note, setNote] = useState("");
  const [catId, setCatId] = useState("");
  const [words, setWords] = useState("");
  const [elapsed, setElapsed] = useState(0);
  const [cue, setCue] = useState("숨을 천천히 내쉬어요");
  const [canStart, setCanStart] = useState(false);
  const workStart = useRef(null);
  const tickRef = useRef(null);
  const breathRef = useRef(null);

  const avg = useMemo(() => {
    if (alarms.length === 0) return null;
    const af = alarms.reduce((s, x) => s + x.fear, 0) / alarms.length;
    const ar = alarms.reduce((s, x) => s + x.real, 0) / alarms.length;
    return { af, ar, gap: af - ar };
  }, [alarms]);

  const verdict = useMemo(() => {
    if (!avg) return "아직 기록이 없어요. 다음 막막함이 올 때 첫 기록을 남겨보세요.";
    if (alarms.length < 3) return alarms.length + "번 기록됨. 몇 번 더 쌓이면 패턴이 보여요.";
    if (avg.gap >= 2) return "매번 " + avg.gap.toFixed(1) + "점씩 과대평가했어요. 그 경보, 거의 항상 거짓이에요.";
    if (avg.gap > 0) return "실제가 공포보다 " + avg.gap.toFixed(1) + "점 낮아요. 조금씩 보이죠?";
    return "이번엔 공포와 실제가 비슷했네요. 그것도 데이터예요.";
  }, [avg, alarms.length]);

  useEffect(() => {
    if (step !== 2) return;
    const cues = ["숨을 천천히 들이쉬고…", "길게 내쉬어요 (4초)", "다시, 천천히 들이쉬고…", "더 길게 내쉬어요"];
    let phase = 0, count = 0;
    setCue(cues[0]); setCanStart(false);
    breathRef.current = setInterval(() => {
      phase = (phase + 1) % cues.length; count += 4;
      setCue(cues[phase]);
      if (count >= 16) setCanStart(true);
    }, 4000);
    const t = setTimeout(() => setCanStart(true), 9000);
    return () => { clearInterval(breathRef.current); clearTimeout(t); };
  }, [step]);

  useEffect(() => {
    if (step !== 3) return;
    workStart.current = Date.now(); setElapsed(0);
    tickRef.current = setInterval(() => setElapsed(Math.floor((Date.now() - workStart.current) / 1000)), 1000);
    return () => clearInterval(tickRef.current);
  }, [step]);

  const fmt = (s) => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  const whenStr = (t) => { const d = new Date(t); return (d.getMonth()+1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };

  const reset = () => { setStep(1); setFear(null); setReal(null); setNote(""); setCatId(""); setWords(""); setElapsed(0); setCanStart(false); };

  const saveEntry = () => {
    const dur = workStart.current ? Math.floor((Date.now() - workStart.current) / 1000) : 0;
    const w = words === "" ? 0 : parseInt(words, 10) || 0;
    onAdd({ t: Date.now(), fear, real, dur, note: note.trim(), catId: catId || null, words: w });
    if (catId && (w || note.trim())) {
      onAddWork(todayStr(), catId, w, note.trim());
    }
    setStep(5);
  };

  const reveal = () => {
    const gap = fear - real;
    if (gap >= 3) return { line: "공포 " + fear + " → 실제 " + real, sub: gap + "점이나 과대평가했어요. 시작 전 그 막막함은 거의 거짓말이었어요. 이걸 몸이 기억하게 하는 게 목적이에요." };
    if (gap > 0) return { line: "공포 " + fear + " → 실제 " + real, sub: "실제가 " + gap + "점 낮았어요. 한 번 더 쌓였습니다." };
    if (gap === 0) return { line: "공포 " + fear + " = 실제 " + real, sub: "이번엔 예측이 정확했네요. 솔직하게 기록한 게 중요해요." };
    return { line: "공포 " + fear + " → 실제 " + real, sub: "이번엔 실제가 더 힘들었어요. 그런 날도 있어요. 그래도 시작은 했잖아요." };
  };

  const Scale = ({ cls, value, onPick }) => (
    <div className={"scale " + cls}>
      {Array.from({length: 11}, (_, i) => i).map((i) => (
        <button key={i} className={value===i ? "sel" : ""} onClick={() => onPick(i)}>{i}</button>
      ))}
    </div>
  );

  return (
    <div>
      <div className="alarm-headline">
        <div className="lead">당신의 평균</div>
        <div className="alarm-nums">
          <div className="n fear"><div className="v">{avg ? avg.af.toFixed(1) : "–"}</div><div className="k">시작 전 공포</div></div>
          <div className="arrow">→</div>
          <div className="n real"><div className="v">{avg ? avg.ar.toFixed(1) : "–"}</div><div className="k">실제 힘듦</div></div>
        </div>
        <div className="alarm-verdict">{verdict}</div>
      </div>

      {step===1 && (
        <div className="alarm-card fade">
          <div className="step-label">STEP 1 · 시작 직전</div>
          <div className="alarm-q">지금 이거 하기가 얼마나 막막해?</div>
          <div className="alarm-hint">머리로 따지지 말고 몸이 느끼는 걸로. 숨 막히는 정도.</div>
          <Scale cls="fear" value={fear} onPick={setFear} />
          <div className="scale-ends"><span>0 · 아무렇지 않음</span><span>10 · 숨 막힘</span></div>
          <button className="alarm-btn go" disabled={fear===null} onClick={() => setStep(2)}>기록하고 시작 준비</button>
        </div>
      )}

      {step===2 && (
        <div className="alarm-card fade">
          <div className="step-label">STEP 2 · 60초 다리 건너기</div>
          <div className="orb" />
          <div className="alarm-cue">{cue}</div>
          <div className="alarm-micro">이건 베껴 쓰기예요. 잘 쓸 필요 없어요.<br/>경보는 일이 위험해서가 아니라 "글쓰기"라는 말에 켜진 거예요.</div>
          {canStart
            ? <button className="alarm-btn go fade" onClick={() => setStep(3)}>지금 시작 — 타이머 켜기</button>
            : <button className="alarm-btn ghost" onClick={() => setStep(3)}>호흡 건너뛰고 바로 시작</button>}
        </div>
      )}

      {step===3 && (
        <div className="alarm-card fade">
          <div className="step-label">STEP 3 · 진행 중</div>
          <div className="alarm-elapsed">{fmt(elapsed)}</div>
          <div className="alarm-hint">끝까지 안 해도 돼요. 멈추고 싶을 때 아래 눌러요.<br/>중요한 건 "시작했다"는 사실이에요.</div>
          <button className="alarm-btn next" onClick={() => { setReal(null); setNote(""); setStep(4); }}>멈춤 · 실제 어땠는지 기록</button>
        </div>
      )}

      {step===4 && (
        <div className="alarm-card fade">
          <div className="step-label">STEP 4 · 끝나고</div>
          <div className="alarm-q">막상 해보니 실제로 얼마나 힘들었어?</div>
          <div className="alarm-hint">시작 전 공포랑 비교해서. 솔직하게.</div>
          <Scale cls="real" value={real} onPick={setReal} />
          <div className="scale-ends"><span>0 · 할 만했음</span><span>10 · 진짜 힘듦</span></div>
          {real!==null && (<React.Fragment>
            <div className="alarm-link">
              <div className="alarm-link-label">오늘 작품 기록에 연결 (선택)</div>
              <div className="cat-chips">
                {workCats.length===0
                  ? <div className="alarm-hint" style={{margin:0}}>작품 항목이 없어요. 작업 일지 탭의 항목 관리에서 추가할 수 있어요.</div>
                  : workCats.map((c) => (
                      <button key={c.id} className={"cat-chip" + (catId===c.id ? " sel" : "")}
                        style={catId===c.id ? { background: c.color, borderColor: c.color, color: "#fff" } : {}}
                        onClick={() => setCatId(catId===c.id ? "" : c.id)}>
                        {c.name}
                      </button>
                    ))}
              </div>
              {catId && (
                <div className="words-row" style={{marginTop:10}}>
                  <input className="words-input" type="number" min="0" placeholder="0"
                    value={words} onChange={(e) => setWords(e.target.value)} />
                  <span className="words-label">자 작성 — 오늘 이 작품 기록에 더해져요</span>
                </div>
              )}
            </div>
            <textarea className="alarm-note" rows={2} value={note} onChange={(e) => setNote(e.target.value)}
              placeholder="한 줄 메모 (선택) — 오늘 시작 직전 가장 도움 된 것 / 몸 느낌" />
          </React.Fragment>)}
          <button className="alarm-btn next" disabled={real===null} onClick={saveEntry}>기록 저장</button>
        </div>
      )}

      {step===5 && (() => { const r = reveal(); const linkedCat = catId ? workCats.find((c) => c.id===catId) : null; const w = words === "" ? 0 : parseInt(words,10)||0; return (
        <div className="alarm-card fade">
          <div className="step-label">기록됨 ✓</div>
          <div className="alarm-q">{r.line}</div>
          <div className="alarm-hint">{r.sub}</div>
          {linkedCat && (w || note.trim()) && (
            <div className="alarm-linked-note">오늘 <b style={{color: linkedCat.color}}>{linkedCat.name}</b> 기록에 {w ? w.toLocaleString()+"자" : "작업"}가 더해졌어요. 작업 일지 탭에서 확인할 수 있어요.</div>
          )}
          <button className="alarm-btn ghost" onClick={reset}>닫기</button>
        </div>
      ); })()}

      <div className="alarm-hist">
        <h4>지나간 거짓 경보들</h4>
        <div className="desc">빨강 = 시작 전 공포 · 초록 = 실제 · 오른쪽 숫자 = 줄어든 폭</div>
        {alarms.length===0 ? (
          <div className="empty">첫 기록을 기다리는 중</div>
        ) : (
          alarms.slice().reverse().slice(0, 12).map((x, i) => {
            const delta = x.fear - x.real;
            return (
              <div key={i} className="alarm-row">
                <div className="when">{whenStr(x.t)}</div>
                <div className="bars">
                  <div className="bar f" style={{ width: (x.fear*9+10) + "%" }} />
                  <div className="bar r" style={{ width: (x.real*9+10) + "%" }} />
                </div>
                <div className="delta">{delta>0 ? "-"+delta : delta===0 ? "0" : "+"+(-delta)}</div>
              </div>
            );
          })
        )}
      </div>

      {alarms.length > 0 && <button className="reset" onClick={() => { if (confirm("거짓 경보 기록을 모두 지울까요?")) onClear(); }}>거짓 경보 기록 초기화</button>}
    </div>
  );
}


// ===================== 구슬 탭 =====================
function OrbsTab({ currentDate, orbCategories, actions, orbs, onAddOrb, onRemoveLastOrb, onAddAction, onManage }) {
  const [selCat, setSelCat] = useState(orbCategories[0]?.id || "");
  const [sizePicker, setSizePicker] = useState(null);
  const [quickName, setQuickName] = useState("");
  const [undoVisible, setUndoVisible] = useState(false);
  const undoTimer = useRef(null);
  const pressTimer = useRef(null);
  const pressStartPos = useRef(null);

  const showUndo = () => {
    if (undoTimer.current) clearTimeout(undoTimer.current);
    setUndoVisible(true);
    undoTimer.current = setTimeout(() => setUndoVisible(false), 5000);
  };
  const handleUndo = () => {
    onRemoveLastOrb();
    setUndoVisible(false);
    if (undoTimer.current) clearTimeout(undoTimer.current);
  };

  const todayOrbs = useMemo(() => orbs[currentDate] || [], [orbs, currentDate]);
  const catActions = useMemo(() => actions.filter((a) => a.categoryId === selCat), [actions, selCat]);

  const summary = useMemo(() => {
    if (todayOrbs.length === 0) return "오늘 아직 구슬이 없어요";
    const counts = {};
    todayOrbs.forEach((o) => {
      const cat = orbCategories.find((c) => c.id === o.categoryId);
      if (cat) counts[cat.name] = (counts[cat.name] || 0) + 1;
    });
    const parts = Object.entries(counts).map(([n, c]) => `${n} 구슬 ${c}개`);
    return `오늘 ${parts.join(", ")}를 모았습니다`;
  }, [todayOrbs, orbCategories]);

  const handleTap = (action) => {
    onAddOrb(action.categoryId, action.id, "m", action.isSpecial);
    showUndo();
  };

  const handlePointerDown = (action, e) => {
    pressStartPos.current = { x: e.clientX || 0, y: e.clientY || 0 };
    const rect = e.currentTarget.getBoundingClientRect();
    pressTimer.current = setTimeout(() => {
      pressTimer.current = null;
      setSizePicker({ action, x: rect.left, y: rect.top - 80 });
    }, 500);
  };

  const handlePointerUp = (action) => {
    if (pressTimer.current) {
      clearTimeout(pressTimer.current);
      pressTimer.current = null;
      handleTap(action);
    }
  };

  const handlePointerMove = (e) => {
    if (pressTimer.current && pressStartPos.current) {
      const dx = (e.clientX || 0) - pressStartPos.current.x;
      const dy = (e.clientY || 0) - pressStartPos.current.y;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
        clearTimeout(pressTimer.current);
        pressTimer.current = null;
      }
    }
  };

  const handlePointerCancel = () => {
    if (pressTimer.current) { clearTimeout(pressTimer.current); pressTimer.current = null; }
  };

  const handleSizeSelect = (size) => {
    if (sizePicker) {
      onAddOrb(sizePicker.action.categoryId, sizePicker.action.id, size, sizePicker.action.isSpecial);
      setSizePicker(null);
      showUndo();
    }
  };

  const handleQuickAdd = () => {
    if (!quickName.trim() || !selCat) return;
    onAddAction(selCat, quickName.trim(), "");
    setQuickName("");
  };

  // 루틴 액션 데이터
  const routineActions = useMemo(() => actions.filter((a) => a.isRoutine), [actions]);

  return (
    <div>
      <OrbJar todayOrbs={todayOrbs} orbCategories={orbCategories} currentDate={currentDate} />
      <div className="orb-summary">{summary}</div>

      <div className="orb-cat-bar">
        {orbCategories.map((c) => (
          <button key={c.id} className={`orb-cat-btn${selCat===c.id ? " on" : ""}`} onClick={() => setSelCat(c.id)}>
            {c.name}
          </button>
        ))}
      </div>

      {catActions.length === 0 ? (
        <div className="orb-empty-msg">이 카테고리에 행동이 없어요.<br/>아래에서 추가하거나, 상단 '구슬 관리'에서 설정하세요.</div>
      ) : (
        <div className="orb-grid">
          {catActions.map((a) => (
            <button key={a.id}
              className={`orb-action-btn${a.isSpecial ? " golden-border" : ""}`}
              onPointerDown={(e) => handlePointerDown(a, e)}
              onPointerUp={() => handlePointerUp(a)}
              onPointerMove={handlePointerMove}
              onPointerCancel={handlePointerCancel}
              onPointerLeave={handlePointerCancel}
              onContextMenu={(e) => e.preventDefault()}
            >
              <span className="orb-action-icon">{a.icon || a.name[0]}</span>
              <span className="orb-action-name">{a.name}</span>
              {a.isRoutine && <span className="orb-routine-dot" />}
            </button>
          ))}
        </div>
      )}

      <div className="orb-quick-row">
        <input className="orb-quick-input" placeholder="새 행동 이름 (현재 카테고리에 추가)" value={quickName}
          onChange={(e) => setQuickName(e.target.value)} onKeyDown={(e) => e.key==="Enter" && handleQuickAdd()} />
        <button className="green-btn" onClick={handleQuickAdd} style={{padding:"8px 14px", fontSize:13}}>추가</button>
      </div>

      <div className="orb-manage-row">
        <button className="ghost-btn" onClick={onManage}>구슬 관리</button>
      </div>

      {sizePicker && (
        <React.Fragment>
          <div className="size-picker-overlay" onClick={() => setSizePicker(null)} />
          <div className="size-picker fade" style={{ left: Math.max(8, Math.min(sizePicker.x - 40, window.innerWidth - 260)), top: Math.max(8, sizePicker.y) }}>
            {["s","m","l","xl"].map((sz) => (
              <button key={sz} className="size-opt" onClick={() => handleSizeSelect(sz)}>
                <div style={{ width: ORB_SIZES[sz]*2, height: ORB_SIZES[sz]*2, borderRadius: "50%", background: sizePicker.action.isSpecial ? "radial-gradient(circle at 35% 35%, #fde68a, #f59e0b)" : `radial-gradient(circle at 35% 35%, ${lighten(orbCategories.find((c)=>c.id===sizePicker.action.categoryId)?.color||"#999", 60)}, ${orbCategories.find((c)=>c.id===sizePicker.action.categoryId)?.color||"#999"})` }} />
                <span className="size-label">{ORB_SIZE_LABELS[sz]}</span>
              </button>
            ))}
          </div>
        </React.Fragment>
      )}

      {routineActions.length > 0 && (
        <RoutineReport orbs={orbs} actions={routineActions} orbCategories={orbCategories} currentDate={currentDate} />
      )}

      {undoVisible && (
        <div className="undo-toast">
          <span>구슬이 추가됨</span>
          <button className="undo-toast-btn" onClick={handleUndo}>되돌리기</button>
        </div>
      )}
    </div>
  );
}


// ===================== 유리병 (Matter.js) =====================
function OrbJar({ todayOrbs, orbCategories, currentDate }) {
  const canvasRef = useRef(null);
  const engineRef = useRef(null);
  const bodyMapRef = useRef(new Map());
  const lastCountRef = useRef(0);
  const rafRef = useRef(null);
  const W = 300, H = 240;

  const catColorMap = useMemo(() => {
    const m = {};
    orbCategories.forEach((c) => { m[c.id] = c.color; });
    return m;
  }, [orbCategories]);

  const drawJar = useCallback((ctx) => {
    const jl = 44, jr = W - 44, jt = 10, jb = H - 10, cr = 18;
    ctx.beginPath();
    ctx.moveTo(jl, jt);
    ctx.lineTo(jl, jb - cr);
    ctx.quadraticCurveTo(jl, jb, jl + cr, jb);
    ctx.lineTo(jr - cr, jb);
    ctx.quadraticCurveTo(jr, jb, jr, jb - cr);
    ctx.lineTo(jr, jt);
    ctx.strokeStyle = "rgba(107,138,126,0.35)";
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(jl + 6, jt + 14);
    ctx.lineTo(jl + 6, jb - cr - 8);
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.stroke();
    ctx.lineCap = "butt";
  }, []);

  const drawMarble = useCallback((ctx, x, y, r, color, special) => {
    ctx.save();
    if (special) {
      ctx.shadowColor = "#f59e0b";
      ctx.shadowBlur = r * 0.7;
    }
    const grad = ctx.createRadialGradient(x - r*0.3, y - r*0.3, r*0.08, x, y, r);
    if (special) {
      grad.addColorStop(0, "#fde68a");
      grad.addColorStop(0.5, "#fbbf24");
      grad.addColorStop(1, "#f59e0b");
    } else {
      grad.addColorStop(0, lighten(color, 50));
      grad.addColorStop(1, color);
    }
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x - r*0.25, y - r*0.25, r*0.28, 0, Math.PI*2);
    ctx.fillStyle = "rgba(255,255,255,0.3)";
    ctx.fill();
    ctx.restore();
  }, []);

  const renderCanvas = useCallback(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, W, H);
    drawJar(ctx);

    if (!engineRef.current) {
      todayOrbs.forEach((orb, i) => {
        const r = ORB_SIZES[orb.size] || ORB_SIZES.m;
        const col = 6;
        const x = 60 + (i % col) * 32 + 16;
        const y = H - 26 - Math.floor(i / col) * 28;
        drawMarble(ctx, x, Math.max(r+12, Math.min(y, H-r-12)), r, catColorMap[orb.categoryId] || "#999", orb.special);
      });
      return;
    }

    const bodies = Matter.Composite.allBodies(engineRef.current.world);
    bodies.forEach((body) => {
      if (body.isStatic) return;
      const data = bodyMapRef.current.get(body.id);
      if (!data) return;
      drawMarble(ctx, body.position.x, body.position.y, data.radius, data.color, data.special);
    });
  }, [drawJar, drawMarble, todayOrbs, catColorMap]);

  useEffect(() => {
    if (!hasMatter) { renderCanvas(); return; }

    const engine = Matter.Engine.create({ gravity: { x: 0, y: 1.2 } });
    engineRef.current = engine;
    bodyMapRef.current.clear();

    const opts = { isStatic: true, friction: 0.6, restitution: 0.1 };
    const walls = [
      Matter.Bodies.rectangle(W/2, H - 4, W - 88, 14, opts),
      Matter.Bodies.rectangle(42, H/2, 12, H, opts),
      Matter.Bodies.rectangle(W - 42, H/2, 12, H, opts),
    ];
    Matter.Composite.add(engine.world, walls);

    todayOrbs.forEach((orb) => {
      const r = ORB_SIZES[orb.size] || ORB_SIZES.m;
      const x = 60 + Math.random() * (W - 120);
      const y = 30 + Math.random() * 80;
      const body = Matter.Bodies.circle(x, y, r, { restitution: 0.3, friction: 0.5, density: 0.003 });
      bodyMapRef.current.set(body.id, { color: catColorMap[orb.categoryId] || "#999", special: orb.special, radius: r });
      Matter.Composite.add(engine.world, body);
    });
    lastCountRef.current = todayOrbs.length;

    for (let i = 0; i < 250; i++) Matter.Engine.update(engine, 16);

    let running = true;
    const loop = () => {
      if (!running) return;
      Matter.Engine.update(engine, 16);
      renderCanvas();
      rafRef.current = requestAnimationFrame(loop);
    };
    rafRef.current = requestAnimationFrame(loop);

    return () => {
      running = false;
      cancelAnimationFrame(rafRef.current);
      Matter.Composite.clear(engine.world, false);
      Matter.Engine.clear(engine);
      engineRef.current = null;
    };
  }, [currentDate, todayOrbs.length]); // eslint-disable-line

  useEffect(() => {
    if (!hasMatter || !engineRef.current) return;
    if (todayOrbs.length > lastCountRef.current) {
      const newOrbs = todayOrbs.slice(lastCountRef.current);
      newOrbs.forEach((orb) => {
        const r = ORB_SIZES[orb.size] || ORB_SIZES.m;
        const x = 80 + Math.random() * (W - 160);
        const body = Matter.Bodies.circle(x, -r * 2, r, { restitution: 0.4, friction: 0.5, density: 0.003 });
        bodyMapRef.current.set(body.id, { color: catColorMap[orb.categoryId] || "#999", special: orb.special, radius: r });
        Matter.Composite.add(engineRef.current.world, body);
      });
      lastCountRef.current = todayOrbs.length;
    }
  }, [todayOrbs.length, catColorMap]);

  return (
    <div className="orb-jar-wrap">
      <canvas ref={canvasRef} width={W} height={H} className="orb-jar-canvas" />
    </div>
  );
}



// ===================== 루틴 패턴 =====================
function RoutineReport({ orbs, actions, orbCategories, currentDate }) {
  const days = useMemo(() => {
    const arr = [];
    for (let i = 29; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      arr.push(ymd(d));
    }
    return arr;
  }, [currentDate]);

  const wasCompleted = (actionId, dateStr) => {
    const day = orbs[dateStr];
    if (!day) return false;
    return day.some((o) => o.actionId === actionId);
  };

  return (
    <section className="card routine-section">
      <div className="gant-title">루틴 패턴</div>
      <div className="gant-scroll">
        <div style={{ minWidth: 92 + 30 * 22 }}>
          <div className="gant-axis">
            <div className="gant-row-label" />
            <div className="gant-track">
              {days.map((ds, i) => {
                const d = parseYmd(ds);
                return <div key={i} className="gant-tick">{d.getDate() % 3 === 1 ? d.getDate() : ""}</div>;
              })}
            </div>
          </div>
          {actions.map((act) => {
            const cat = orbCategories.find((c) => c.id === act.categoryId);
            return (
              <div key={act.id} className="gant-row">
                <div className="gant-row-label" title={act.name}>
                  <span className="gant-swatch" style={{ background: cat?.color || "#999" }} />
                  <span className="gant-name">{act.name}</span>
                </div>
                <div className="gant-track">
                  {days.map((ds, di) => {
                    const on = wasCompleted(act.id, ds);
                    const prevOn = di > 0 && wasCompleted(act.id, days[di-1]);
                    const nextOn = di < days.length - 1 && wasCompleted(act.id, days[di+1]);
                    return (
                      <div key={di} className="gant-cell">
                        {on && (
                          <div className="gant-bar" style={{
                            background: cat?.color || "#999", opacity: 0.7,
                            borderTopLeftRadius: prevOn ? 0 : 6, borderBottomLeftRadius: prevOn ? 0 : 6,
                            borderTopRightRadius: nextOn ? 0 : 6, borderBottomRightRadius: nextOn ? 0 : 6,
                            marginLeft: prevOn ? -2 : 0, marginRight: nextOn ? -2 : 0,
                          }} />
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </section>
  );
}


// ===================== 아카이브 탭 =====================
function ArchiveTab({ orbs, archives, orbCategories, currentDate, goldenForMonth }) {
  const currentYM = currentDate.substring(0, 7);

  const allMonths = useMemo(() => {
    const set = new Set();
    for (const ds in orbs) set.add(ds.substring(0, 7));
    return [...set].sort().reverse();
  }, [orbs]);

  const pastMonths = useMemo(() => allMonths.filter((ym) => ym < currentYM), [allMonths, currentYM]);
  const currentGolden = goldenForMonth(currentYM);

  const ymLabel = (ym) => {
    const [y, m] = ym.split("-");
    return `${y}년 ${parseInt(m)}월`;
  };

  const goldenDots = (count, size) => {
    const dots = [];
    const show = Math.min(count, 40);
    for (let i = 0; i < show; i++) {
      dots.push(<div key={i} className="archive-golden-orb" style={{ width: size, height: size }} />);
    }
    return dots;
  };

  return (
    <div>
      <div className="archive-current">
        <div className="archive-current-title">이달의 보관함</div>
        <div className="archive-mini-jar">
          {currentGolden === 0
            ? <div style={{ color: "var(--faint)", fontSize: 12, padding: "8px 0" }}>아직 황금 구슬이 없어요</div>
            : goldenDots(currentGolden, 14)}
        </div>
        <div className="archive-count">{currentGolden > 0 ? `황금 구슬 ${currentGolden}개` : ""}</div>
        <div className="archive-month-label">{ymLabel(currentYM)}</div>
      </div>

      {pastMonths.length > 0 && (
        <React.Fragment>
          <div className="gant-title" style={{ marginBottom: 14 }}>지난 보관함</div>
          <div className="archive-grid">
            {pastMonths.map((ym) => {
              const gc = goldenForMonth(ym);
              return (
                <div key={ym} className="archive-card">
                  <div className="archive-card-jar">
                    {gc === 0
                      ? <div style={{ color: "var(--faint)", fontSize: 11, padding: "4px 0" }}>-</div>
                      : goldenDots(gc, 10)}
                  </div>
                  <div className="archive-card-title">{ymLabel(ym)}</div>
                  <div className="archive-card-count">황금 구슬 {gc}개</div>
                </div>
              );
            })}
          </div>
        </React.Fragment>
      )}

      {pastMonths.length === 0 && currentGolden === 0 && (
        <div className="empty">구슬 탭에서 핵심 행동을 기록하면<br/>황금 구슬이 여기에 모여요.</div>
      )}
    </div>
  );
}


// ===================== 구슬 관리 모달 =====================
function OrbActionManager({ orbCategories, actions, onAddCategory, onUpdateCategory, onRemoveCategory, onAddAction, onUpdateAction, onRemoveAction, onClose }) {
  const [catName, setCatName] = useState("");
  const [actCatId, setActCatId] = useState(orbCategories[0]?.id || "");
  const [actName, setActName] = useState("");
  const [actIcon, setActIcon] = useState("");
  const [pickerId, setPickerId] = useState(null);

  const handleAddCat = () => {
    if (!catName.trim()) return;
    onAddCategory(catName.trim());
    setCatName("");
  };

  const handleAddAction = () => {
    if (!actName.trim() || !actCatId) return;
    onAddAction(actCatId, actName.trim(), actIcon.trim());
    setActName(""); setActIcon("");
  };

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><div className="modal-date">구슬 관리</div><button className="close-btn" onClick={onClose}>×</button></div>
        <div className="modal-body">
          <div className="field-label">카테고리</div>
          <div className="add-row" style={{ marginBottom: 10 }}>
            <input className="add-input" placeholder="새 카테고리" value={catName}
              onChange={(e) => setCatName(e.target.value)} onKeyDown={(e) => e.key==="Enter" && handleAddCat()} />
            <button className="green-btn" style={{padding:"8px 14px", fontSize:13}} onClick={handleAddCat}>추가</button>
          </div>
          <div className="cat-list" style={{ marginBottom: 16 }}>
            {orbCategories.map((c) => (
              <div key={c.id} className="cat-item">
                <button className="swatch-btn" style={{ background: c.color }} onClick={() => setPickerId(pickerId===c.id ? null : c.id)} />
                <input className="cat-name-input" value={c.name} onChange={(e) => onUpdateCategory(c.id, { name: e.target.value })} />
                <button className="del-btn" onClick={() => { if (confirm(c.name + " 카테고리와 소속 행동을 삭제할까요?")) onRemoveCategory(c.id); }}>×</button>
                {pickerId===c.id && (
                  <div className="color-pop" onClick={(e) => e.stopPropagation()}>
                    <div className="color-grid">
                      {PALETTE.map((p) => (
                        <button key={p} className={`color-cell${c.color===p ? " sel" : ""}`} style={{ background: p }}
                          onClick={() => { onUpdateCategory(c.id, { color: p }); setPickerId(null); }} />
                      ))}
                    </div>
                    <label className="color-custom">직접 고르기<input type="color" value={c.color} onChange={(e) => onUpdateCategory(c.id, { color: e.target.value })} /></label>
                  </div>
                )}
              </div>
            ))}
          </div>

          <div className="field-label">행동 추가</div>
          <div className="add-row" style={{ marginBottom: 4 }}>
            <select className="orb-select" value={actCatId} onChange={(e) => setActCatId(e.target.value)}>
              {orbCategories.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <input className="add-input" placeholder="행동 이름" value={actName} style={{flex:1}}
              onChange={(e) => setActName(e.target.value)} onKeyDown={(e) => e.key==="Enter" && handleAddAction()} />
            <input className="add-input" placeholder="아이콘" value={actIcon} style={{width:52, flex:"none"}}
              onChange={(e) => setActIcon(e.target.value)} />
            <button className="green-btn" style={{padding:"8px 14px", fontSize:13}} onClick={handleAddAction}>추가</button>
          </div>
          <p className="hint">아이콘은 이모지 한 글자 또는 비워두면 이름 첫 글자가 표시돼요.</p>

          {orbCategories.map((cat) => {
            const catActs = actions.filter((a) => a.categoryId === cat.id);
            if (catActs.length === 0) return null;
            return (
              <div key={cat.id} className="orb-cat-section">
                <div className="orb-cat-section-head">
                  <span className="orb-cat-section-swatch" style={{ background: cat.color }} />
                  {cat.name}
                </div>
                <div className="cat-list">
                  {catActs.map((a) => (
                    <div key={a.id} className="cat-item" style={{ gap: 6 }}>
                      <span style={{ fontSize: 18, width: 28, textAlign: "center", flexShrink: 0 }}>{a.icon || a.name[0]}</span>
                      <input className="cat-name-input" value={a.name} onChange={(e) => onUpdateAction(a.id, { name: e.target.value })} />
                      <button className={`mini-tag${a.isSpecial ? " on" : ""}`} style={{ fontSize: 10 }}
                        onClick={() => onUpdateAction(a.id, { isSpecial: !a.isSpecial })}>핵심</button>
                      <button className={`mini-tag${a.isRoutine ? " on-green" : ""}`} style={{ fontSize: 10 }}
                        onClick={() => onUpdateAction(a.id, { isRoutine: !a.isRoutine })}>루틴</button>
                      <button className="del-btn" onClick={() => onRemoveAction(a.id)}>×</button>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
        <div className="modal-foot"><button className="green-btn" onClick={onClose}>완료</button></div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
