<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#eaf6f2" />
<title>작업 일지</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Outfit:wght@400;500;600;700;800&family=Pretendard+Variable:wght@400;500;700;800&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css" rel="stylesheet" />
<style>
  :root {
    --paper: #eaf6f2;
    --ink: #2a3d36;
    --ink-deep: #1a2d26;
    --muted: #6b8a7e;
    --faint: #9cb5aa;
    --accent: #e94560;
    --accent-soft: #fde8ec;
    --line: #c8e6db;
    --line-strong: #b0d6c8;
    --card: #fff;
    --font-display: 'East Sea Dokdo', cursive;
    --font-body: 'Pretendard Variable', 'Pretendard', sans-serif;
    --wood: #c4915e;
    --wood-deep: #a87040;
    --wood-light: #e0b888;
    --green: #34d399;
    --green-deep: #0d9466;
    --green-soft: #d0f0e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--paper);
    background-image: none;
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }

  /* ===== 탭 바 ===== */
  .tab-bar { display: flex; gap: 4px; background: #d8efe6; border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 18px; }
  .tab-btn { flex: 1; border: none; background: transparent; padding: 8px 4px; border-radius: 9px; font-family: var(--font-body); font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-btn.on { background: var(--card); color: var(--accent); box-shadow: 0 1px 3px #0000000f; }
  .tab-btn.on-green { background: var(--card); color: var(--green-deep); box-shadow: 0 1px 3px #0000000f; }

  /* ===== 거짓 경보 ===== */
  .alarm-headline { background: linear-gradient(160deg, #fff, #f0faf6); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-bottom: 16px; text-align: center; }
  .alarm-headline .lead { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .alarm-nums { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .alarm-nums .n { display: flex; flex-direction: column; align-items: center; }
  .alarm-nums .v { font-family: var(--font-display); font-weight: 400; font-size: 44px; line-height: 1; }
  .alarm-nums .k { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .alarm-nums .fear .v { color: #f87171; }
  .alarm-nums .real .v { color: #34d399; }
  .alarm-nums .arrow { color: var(--faint); font-size: 20px; }
  .alarm-verdict { margin-top: 13px; font-family: var(--font-display); font-size: 15px; color: var(--accent); min-height: 20px; }
  .alarm-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px #0000000d; }
  .step-label { font-size: 12px; color: var(--accent); letter-spacing: .5px; margin-bottom: 6px; font-weight: 700; }
  .alarm-q { font-family: var(--font-display); font-size: 24px; margin-bottom: 4px; line-height: 1.4; color: var(--ink-deep); }
  .alarm-hint { color: var(--muted); font-size: 12.5px; line-height: 1.6; margin-bottom: 16px; }
  .scale { display: flex; gap: 6px; flex-wrap: wrap; }
  .scale button { flex: 1; min-width: 26px; aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--line-strong); background: #f0faf6; color: var(--muted); font-family: var(--font-display); font-size: 16px; transition: .12s; }
  .scale button:active { transform: scale(.9); }
  .scale.fear button.sel { background: #f87171; color: #fff; border-color: #f87171; }
  .scale.real button.sel { background: #34d399; color: #fff; border-color: #34d399; }
  .scale-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin-top: 7px; }
  .orb { width: 120px; height: 120px; border-radius: 50%; margin: 6px auto 14px; background: radial-gradient(circle at 40% 35%, #6ee7b7, #059669); animation: bre 8s ease-in-out infinite; }
  @keyframes bre { 0%,100% { transform: scale(.7); opacity: .65; } 50% { transform: scale(1); opacity: 1; } }
  .alarm-cue { font-family: var(--font-display); font-size: 17px; min-height: 24px; color: var(--ink); text-align: center; }
  .alarm-micro { color: var(--muted); font-size: 12.5px; margin-top: 10px; line-height: 1.7; text-align: center; }
  .alarm-elapsed { font-family: var(--font-display); font-size: 50px; text-align: center; color: var(--ink-deep); margin-bottom: 8px; }
  .alarm-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-family: var(--font-body); font-size: 15px; font-weight: 700; margin-top: 14px; }
  .alarm-btn:active { transform: scale(.98); }
  .alarm-btn.go { background: linear-gradient(120deg, #059669, #34d399); color: #fff; }
  .alarm-btn.next { background: var(--accent); color: #fff; }
  .alarm-btn.ghost { background: transparent; border: 1px solid var(--line-strong); color: var(--muted); }
  .alarm-btn:disabled { opacity: .35; }
  .alarm-note { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line-strong); background: #f0faf6; color: var(--ink); font-family: var(--font-body); font-size: 14px; resize: none; margin-top: 10px; }
  .alarm-note:focus { outline: none; border-color: var(--accent); }
  .alarm-hist h4 { font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: .5px; margin-bottom: 6px; }
  .alarm-hist .desc { font-size: 11.5px; color: var(--faint); margin-bottom: 12px; line-height: 1.5; }
  .alarm-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .alarm-row .when { font-size: 11px; color: var(--muted); width: 78px; flex-shrink: 0; }
  .alarm-row .bars { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .alarm-row .bar { height: 7px; border-radius: 4px; }
  .alarm-row .bar.f { background: #f87171; }
  .alarm-row .bar.r { background: #34d399; }
  .alarm-row .delta { font-family: var(--font-display); font-size: 15px; color: var(--accent); width: 36px; text-align: right; }
  .alarm-link { border-top: 1px dashed var(--line-strong); margin-top: 16px; padding-top: 14px; }
  .alarm-link-label { font-size: 12px; color: var(--accent); font-weight: 700; margin-bottom: 8px; }
  .cat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .cat-chip { border: 1px solid var(--line-strong); background: #f0faf6; color: var(--ink); border-radius: 18px; padding: 6px 13px; font-family: var(--font-body); font-size: 13px; }
  .cat-chip.sel { font-weight: 700; }
  .alarm-linked-note { font-size: 12.5px; color: #0d9466; background: #d0f0e4; border-radius: 10px; padding: 10px 12px; margin-top: 12px; line-height: 1.5; }
  h1 { font-family: var(--font-display); font-size: 40px; font-weight: 400; margin: 0; letter-spacing: .02em; color: var(--ink-deep); }
  .subtitle { margin: 4px 0 0; font-size: 13px; color: var(--muted); }

  header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; gap: 12px; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  button, .btn { font-family: var(--font-body); cursor: pointer; }
  .ghost-btn { background: var(--card); color: var(--muted); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 14px; font-size: 13px; font-weight: 500; }
  .ghost-btn:active { transform: scale(.97); }
  .green-btn { background: var(--green); color: #fff; border: none; border-radius: 10px; padding: 9px 18px; font-size: 14px; font-weight: 700; }
  .green-btn:active { transform: scale(.97); }
  .primary-btn { background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 9px 18px; font-size: 14px; font-weight: 700; }
  .primary-btn:active { transform: scale(.97); }

  .sync-badge { font-size: 12px; min-width: 60px; text-align: right; }
  .sync-idle { color: var(--faint); }
  .sync-ok { color: #34d399; }
  .sync-warn { color: var(--accent); }
  .sync-sync { color: var(--muted); }

  .month-bar { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 6px 0 18px; }
  .nav-btn { background: var(--card); border: 1px solid var(--line-strong); border-radius: 12px; width: 40px; height: 40px; font-size: 22px; line-height: 1; color: var(--muted); box-shadow: 0 1px 2px #0000000a; }
  .month-label { text-align: center; min-width: 130px; }
  .month-year { display: block; font-size: 12px; color: var(--faint); letter-spacing: .15em; }
  .month-name { display: block; font-family: var(--font-display); font-size: 34px; font-weight: 400; color: var(--ink-deep); }

  .stats-row { display: flex; gap: 10px; margin-bottom: 18px; }
  .stat { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; text-align: center; box-shadow: 0 1px 3px #0000000a; }
  .stat-num { font-family: var(--font-display); font-size: 30px; font-weight: 400; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 16px; box-shadow: 0 2px 8px #0000000d; }

  .week-header { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .week-header-cell { text-align: center; font-size: 12px; font-weight: 700; padding: 4px 0; }
  .week-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .day-empty { aspect-ratio: 1/1; }
  .day { aspect-ratio: 1/1; border: 1px solid var(--line); border-radius: 10px; background: #f8fcfa; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 6px 2px 2px; position: relative; transition: background .15s, transform .1s; }
  .day:hover { background: #eef7f3; transform: translateY(-1px); }
  .day.today { border: 2px solid var(--accent); background: #fde8ec; }
  .day-num { font-size: 14px; }
  .day-dots { display: flex; gap: 2px; margin-top: auto; margin-bottom: 4px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
  .day-words { margin-top: auto; margin-bottom: 4px; height: 16px; display: flex; align-items: center; justify-content: center; }
  .words-count { font-size: 11px; font-weight: 700; color: var(--accent); line-height: 1; }
  .words-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .dot { width: 6px; height: 6px; border-radius: 50%; }

  .gant-title { font-family: var(--font-display); font-size: 22px; font-weight: 400; margin-bottom: 12px; color: var(--ink-deep); }
  .empty { padding: 22px 8px; text-align: center; color: var(--faint); font-size: 13px; }
  .reset { display: block; margin: 24px auto 0; background: none; border: none; color: var(--faint); font-size: 11px; cursor: pointer; }
  .fade { animation: fd .35s; }
  @keyframes fd { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .gant-scroll { overflow-x: auto; padding-bottom: 6px; }
  .gant-axis, .gant-row { display: flex; align-items: center; margin-bottom: 6px; }
  .gant-row-label { width: 92px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding-right: 8px; }
  .gant-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .gant-name { font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gant-track { display: flex; flex: 1; }
  .gant-tick { width: 22px; flex-shrink: 0; text-align: center; font-size: 9px; color: var(--faint); }
  .gant-cell { width: 22px; flex-shrink: 0; height: 18px; display: flex; align-items: center; padding: 0 1px; }
  .gant-bar { height: 14px; width: 100%; box-shadow: 0 1px 2px #00000018; }

  .backup-row { display: flex; gap: 10px; justify-content: center; margin-top: 8px; flex-wrap: wrap; }

  /* ===== 모달 ===== */
  .overlay { position: fixed; inset: 0; background: #1a2d2688; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; backdrop-filter: blur(3px); }
  .modal { background: var(--paper); border-radius: 18px; width: 100%; max-width: 480px; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px #00000040; border: 1px solid var(--line-strong); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
  .modal-date { font-family: var(--font-display); font-size: 28px; font-weight: 400; color: var(--ink-deep); }
  .modal-weekday { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .close-btn { background: none; border: none; font-size: 28px; line-height: 1; color: var(--faint); }
  .modal-body { padding: 16px 20px; overflow-y: auto; }
  .modal-foot { padding: 12px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--line); }

  .entry-block { margin-bottom: 16px; }
  .entry-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .entry-swatch { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .entry-name { font-size: 14px; font-weight: 700; color: var(--ink); }
  .work-tag { font-size: 10px; background: var(--accent-soft); color: var(--accent); padding: 2px 7px; border-radius: 20px; font-weight: 700; }
  textarea, input { font-family: var(--font-body); }
  .textarea { width: 100%; border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; font-size: 13px; resize: vertical; background: #fff; color: var(--ink); }
  .words-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .words-input { width: 120px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; font-size: 14px; background: #fff; color: var(--ink); }
  .words-label { font-size: 13px; color: var(--muted); }
  textarea:focus, input:focus { outline: 2px solid #e9456033; border-color: var(--accent); }

  .add-row { display: flex; gap: 8px; align-items: stretch; }
  .add-input { flex: 1; border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; font-size: 14px; background: #fff; color: var(--ink); }
  .toggle-btn { border: 1px solid var(--line-strong); background: var(--card); border-radius: 10px; padding: 0 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .toggle-btn.on { background: var(--accent-soft); color: var(--accent); border-color: #f0b0bb; font-weight: 700; }
  .hint { font-size: 12px; color: var(--faint); margin: 8px 2px 14px; }
  .cat-list { display: flex; flex-direction: column; gap: 8px; }
  .cat-item { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; position: relative; transition: border-color .12s, transform .08s, box-shadow .12s; }
  .cat-item.dragging { opacity: .5; }
  .cat-item.drag-over { border-color: var(--accent); box-shadow: 0 -2px 0 var(--accent) inset; }
  .drag-handle { cursor: grab; color: var(--faint); font-size: 14px; line-height: 1; letter-spacing: -2px; user-select: none; flex-shrink: 0; }
  .drag-handle:active { cursor: grabbing; }
  .reorder-btns { display: flex; flex-direction: column; gap: 1px; flex-shrink: 0; }
  .reorder-btn { background: var(--card); border: 1px solid var(--line-strong); color: var(--muted); width: 20px; height: 15px; font-size: 10px; line-height: 1; padding: 0; border-radius: 4px; }
  .reorder-btn:disabled { opacity: .3; }
  .swatch-btn { width: 20px; height: 20px; border-radius: 6px; border: 1px solid #00000018; flex-shrink: 0; cursor: pointer; padding: 0; }
  .color-pop { position: absolute; top: 100%; left: 8px; margin-top: 4px; background: #fff; border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px; box-shadow: 0 8px 24px #00000018; z-index: 10; }
  .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 8px; }
  .color-cell { width: 26px; height: 26px; border-radius: 7px; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .color-cell.sel { border-color: var(--ink-deep); box-shadow: 0 0 0 2px #fff inset; }
  .color-custom { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .color-custom input[type=color] { width: 36px; height: 26px; border: none; background: none; padding: 0; cursor: pointer; }
  .cat-name-input { flex: 1; min-width: 40px; border: none; background: transparent; font-size: 14px; color: var(--ink); padding: 2px 0; }
  .mini-tag { border: 1px solid var(--line-strong); background: var(--card); border-radius: 16px; padding: 3px 10px; font-size: 11px; color: var(--muted); }
  .mini-tag.on { background: var(--accent-soft); color: var(--accent); border-color: #f0b0bb; font-weight: 700; }
  .mini-tag.on-green { background: var(--green-soft); color: var(--green-deep); border-color: #a0d4c0; font-weight: 700; }
  .del-btn { background: none; border: none; font-size: 22px; color: var(--faint); line-height: 1; padding: 0 4px; }

  .field-label { font-size: 12px; color: var(--muted); margin: 12px 2px 4px; }
  .status-note { font-size: 12px; color: var(--muted); margin: 6px 2px 0; line-height: 1.5; }
  .status-note a { color: var(--accent); }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #b0d6c8; border-radius: 8px; }

  /* ===== 구슬 탭 ===== */
  .orb-jar-wrap { display: flex; justify-content: center; margin-bottom: 8px; }
  .orb-jar-canvas { display: block; max-width: 100%; border-radius: 0 0 18px 18px; }
  .orb-summary { text-align: center; font-family: var(--font-display); font-size: 14px; color: var(--muted); margin-bottom: 16px; line-height: 1.7; min-height: 22px; }
  .orb-cat-bar { display: flex; gap: 3px; background: #d8efe6; border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .orb-cat-btn { flex: 1; border: none; background: transparent; padding: 8px 4px; border-radius: 8px; font-family: var(--font-body); font-size: 12.5px; font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .orb-cat-btn.on { background: var(--card); color: var(--green-deep); box-shadow: 0 1px 3px #0000000f; }
  .orb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .orb-action-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 68px; min-width: 44px; border: 1.5px solid var(--line-strong); border-radius: 14px; background: #f0faf6; font-family: var(--font-body); color: var(--ink); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; padding: 6px 4px; transition: transform .08s; }
  .orb-action-btn:active { transform: scale(.91); }
  .orb-action-btn.golden-border { border-color: var(--wood-light); background: linear-gradient(160deg, #fdfaf4, #fdf3e0); box-shadow: 0 0 0 1px #e0b88822; }
  .orb-action-icon { font-size: 22px; line-height: 1.1; }
  .orb-action-name { font-size: 10px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; text-align: center; }
  .orb-routine-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .orb-empty-msg { text-align: center; color: var(--faint); font-size: 13px; padding: 20px 8px; line-height: 1.7; }
  .orb-manage-row { display: flex; gap: 8px; justify-content: center; margin-top: 6px; margin-bottom: 16px; }
  .undo-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink-deep); color: #fff; border-radius: 12px; padding: 10px 20px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 16px #00000020; z-index: 40; display: flex; align-items: center; gap: 12px; animation: fd .25s; }
  .undo-toast-btn { background: none; border: none; color: var(--accent); font-family: var(--font-body); font-size: 14px; font-weight: 700; padding: 0; cursor: pointer; }

  /* ===== 크기 선택 ===== */
  .size-picker-overlay { position: fixed; inset: 0; z-index: 60; background: transparent; }
  .size-picker { position: fixed; background: var(--card); border: 1px solid var(--line-strong); border-radius: 16px; padding: 10px 12px; box-shadow: 0 8px 28px #00000030; z-index: 61; display: flex; gap: 10px; }
  .size-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px; border-radius: 12px; border: 1px solid var(--line); background: #f0faf6; min-width: 50px; font-family: var(--font-body); color: var(--ink); }
  .size-opt:active { transform: scale(.9); background: var(--green-soft); }
  .size-label { font-size: 10px; color: var(--muted); }

  /* ===== 아카이브 탭 ===== */
